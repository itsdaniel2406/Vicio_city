<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>VICIO CITY V3.3.0 - Ultimate Vehicle & Door Build</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }
    body {
      background: #05050a;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }
    #game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }
    canvas { display: block; background: #0d0f18; }

    /* HUD */
    .hud-panel {
      position: absolute;
      top: 10px;
      left: 10px;
      width: 260px;
      padding: 10px;
      background: rgba(10, 10, 20, 0.88);
      border: 2px solid #ff007f;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(255, 0, 127, 0.4);
      font-size: 11px;
      font-weight: bold;
      z-index: 10;
      pointer-events: none;
    }
    .hud-title { color: #ff007f; font-size: 13px; margin-bottom: 4px; }
    .hud-stats { display: flex; justify-content: space-between; margin-bottom: 2px; color: #00ffff; }
    .hud-mission {
      margin-top: 6px;
      padding: 6px;
      background: rgba(255, 230, 0, 0.15);
      border: 1px solid #ffe600;
      border-radius: 5px;
      color: #ffe600;
    }

    /* Botones Superiores */
    .top-buttons {
      position: absolute;
      top: 10px;
      right: 140px;
      display: flex;
      gap: 6px;
      z-index: 10;
    }
    .btn-top {
      padding: 6px 12px;
      background: rgba(0, 255, 255, 0.2);
      border: 1.5px solid #00ffff;
      border-radius: 5px;
      color: #00ffff;
      font-weight: bold;
      font-size: 11px;
      cursor: pointer;
    }

    /* Minimapa */
    #minimap-container {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 110px;
      height: 110px;
      border: 2px solid #ff007f;
      border-radius: 50%;
      overflow: hidden;
      box-shadow: 0 0 10px rgba(255, 0, 127, 0.5);
      z-index: 10;
      pointer-events: none;
    }
    #minimap-canvas { width: 100%; height: 100%; background: #05050a; }

    /* Controles Táctiles D-PAD y Botones */
    .controls-left {
      position: absolute;
      bottom: 15px;
      left: 15px;
      display: grid;
      grid-template-columns: repeat(3, 44px);
      grid-gap: 4px;
      z-index: 20;
    }
    .dbtn {
      width: 44px;
      height: 44px;
      background: rgba(0, 255, 255, 0.2);
      border: 1.5px solid #00ffff;
      border-radius: 8px;
      color: #00ffff;
      font-size: 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
    }

    .controls-right {
      position: absolute;
      bottom: 15px;
      right: 15px;
      display: flex;
      gap: 10px;
      z-index: 20;
    }
    .abtn {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      border: 2px solid;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 20px;
      cursor: pointer;
    }
    .btn-car { border-color: #00ffff; color: #00ffff; background: rgba(0, 255, 255, 0.2); }
    .btn-action { border-color: #ff007f; color: #ff007f; background: rgba(255, 0, 127, 0.2); }
    .btn-weapon { border-color: #ffe600; color: #ffe600; background: rgba(255, 230, 0, 0.2); }

    /* Modal Vestidor */
    #outfit-modal {
      display: none;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(10, 10, 25, 0.95);
      border: 2px solid #00ffff;
      padding: 15px;
      border-radius: 10px;
      text-align: center;
      z-index: 100;
    }
    .color-opt {
      width: 35px;
      height: 35px;
      border-radius: 50%;
      display: inline-block;
      margin: 6px;
      cursor: pointer;
      border: 2px solid #fff;
    }
  </style>
</head>
<body>

<div id="game-container">
  <canvas id="gameCanvas"></canvas>

  <div class="hud-panel">
    <div class="hud-title">VICIO CITY V3.3.0</div>
    <div class="hud-stats"><span>LVL: 1</span><span>XP: 95/100</span></div>
    <div class="hud-stats"><span>HP: <span id="val-hp">100</span>/100</span><span>CASH: $<span id="val-cash">960</span></span></div>
    <div class="hud-stats"><span>VEHÍCULO: <span id="val-veh" style="color:#ffe600;">A Pie</span></span></div>
    <div class="hud-mission">
      🎯 <b>MISIÓN ACTIVA:</b><br>
      Elimina 3 Pandilleros (<span id="val-targets">0</span>/3)<br>
      <small>[Prueba el Tanque, Moto, Heli y Superdeportivo]</small>
    </div>
  </div>

  <div class="top-buttons">
    <button class="btn-top" onclick="toggleFullscreen()">FULL</button>
    <button class="btn-top" onclick="alert('Usa los marcadores de las puertas para entrar a los edificios y busca los vehículos especiales por el mapa.')">INFO</button>
    <button class="btn-top" onclick="alert('Juego Guardado')">GUARDAR</button>
  </div>

  <div id="minimap-container">
    <canvas id="minimap-canvas" width="110" height="110"></canvas>
  </div>

  <div class="controls-left">
    <div></div><div class="dbtn" id="btn-up">▲</div><div></div>
    <div class="dbtn" id="btn-left">◀</div><div></div><div class="dbtn" id="btn-right">▶</div>
    <div></div><div class="dbtn" id="btn-down">▼</div><div></div>
  </div>

  <div class="controls-right">
    <div class="abtn btn-car" id="btn-car">🚗</div>
    <div class="abtn btn-action" id="btn-door">🚪</div>
    <div class="abtn btn-weapon" id="btn-shoot">🔫</div>
  </div>

  <div id="outfit-modal">
    <h3 style="color:#00ffff; margin-bottom:8px;">VESTIDOR DE ROPA</h3>
    <p style="font-size:12px;">Selecciona el color del traje:</p>
    <div class="color-opt" style="background:#ff007f;" onclick="changeOutfit('#ff007f')"></div>
    <div class="color-opt" style="background:#00ffff;" onclick="changeOutfit('#00ffff')"></div>
    <div class="color-opt" style="background:#00ff66;" onclick="changeOutfit('#00ff66')"></div>
    <div class="color-opt" style="background:#ffaa00;" onclick="changeOutfit('#ffaa00')"></div>
    <br><br>
    <button class="btn-top" onclick="closeOutfit()">Aceptar</button>
  </div>
</div>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");
const mCanvas = document.getElementById("minimap-canvas");
const mCtx = mCanvas.getContext("2d");

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener("resize", resize);
resize();

const WORLD = { width: 2500, height: 2500 };
const camera = { x: 0, y: 0 };
let heliRotorAngle = 0;

// Jugador
const player = {
  x: 1200, y: 1200, speed: 4, angle: 0,
  color: "#ff007f", cash: 960, hp: 100,
  vehicle: null, dirX: 0, dirY: -1
};

// Lista de Vehículos
const vehicles = [
  { id: 1, type: "CAR_SEDAN", name: "Sedán Urbano", x: 1280, y: 1220, w: 38, h: 65, speed: 6.5, color: "#00ffff", angle: 0 },
  { id: 2, type: "CAR_SUPER", name: "Superdeportivo Neon", x: 1600, y: 1200, w: 42, h: 72, speed: 10, color: "#ff007f", angle: 0, neon: true },
  { id: 3, type: "BIKE", name: "Moto Pista", x: 1100, y: 1300, w: 20, h: 45, speed: 8.5, color: "#ffe600", angle: 0 },
  { id: 4, type: "HELI", name: "Helicóptero", x: 1800, y: 800, w: 50, h: 80, speed: 7.5, color: "#00ff66", angle: 0 },
  { id: 5, type: "TANK", name: "Tanque Blindado", x: 600, y: 1600, w: 55, h: 75, speed: 3.5, color: "#445533", angle: 0 }
];

// Edificios y Puertas Interactivas
const buildings = [
  { id: "CASA", label: "Casa Principal", x: 1100, y: 1000, w: 140, h: 100, doorX: 1150, doorY: 1090, color: "#2a1b4e" },
  { id: "BANCO", label: "Banco Central", x: 1500, y: 1000, w: 180, h: 110, doorX: 1570, doorY: 1100, color: "#1b334e" },
  { id: "TALLER", label: "Taller Tuning", x: 800, y: 1400, w: 160, h: 120, doorX: 860, doorY: 1510, color: "#3a2a1e" }
];

const bullets = [];
const enemies = [
  { x: 900, y: 1300, hp: 30, active: true, dirX: 1, dirY: 0 },
  { x: 1400, y: 800, hp: 30, active: true, dirX: 0, dirY: 1 },
  { x: 1700, y: 1500, hp: 30, active: true, dirX: -1, dirY: 0 }
];

let targetsDefeated = 0;
let currentZone = "EXTERIOR";
const keys = { up: false, down: false, left: false, right: false };

// Controles Teclado y Táctiles
window.addEventListener("keydown", e => {
  const k = e.key.toLowerCase();
  if (k === 'w' || k === 'arrowup') keys.up = true;
  if (k === 's' || k === 'arrowdown') keys.down = true;
  if (k === 'a' || k === 'arrowleft') keys.left = true;
  if (k === 'd' || k === 'arrowright') keys.right = true;
  if (k === ' ') shoot();
  if (k === 'e') interactVehicle();
  if (k === 'f') interactDoor();
});

window.addEventListener("keyup", e => {
  const k = e.key.toLowerCase();
  if (k === 'w' || k === 'arrowup') keys.up = false;
  if (k === 's' || k === 'arrowdown') keys.down = false;
  if (k === 'a' || k === 'arrowleft') keys.left = false;
  if (k === 'd' || k === 'arrowright') keys.right = false;
});

function bindTouch(id, action) {
  const el = document.getElementById(id);
  if (!el) return;
  el.addEventListener("touchstart", e => {
    e.preventDefault();
    if (typeof action === "string") keys[action] = true;
    else if (typeof action === "function") action();
  }, { passive: false });
  el.addEventListener("touchend", e => {
    e.preventDefault();
    if (typeof action === "string") keys[action] = false;
  }, { passive: false });
}

bindTouch("btn-up", "up");
bindTouch("btn-down", "down");
bindTouch("btn-left", "left");
bindTouch("btn-right", "right");
bindTouch("btn-shoot", shoot);
bindTouch("btn-car", interactVehicle);
bindTouch("btn-door", interactDoor);

function shoot() {
  const isTank = player.vehicle && player.vehicle.type === "TANK";
  bullets.push({
    x: player.x,
    y: player.y,
    vx: player.dirX * (isTank ? 15 : 12),
    vy: player.dirY * (isTank ? 15 : 12),
    isCannon: isTank,
    life: 50
  });
}

function interactVehicle() {
  if (!player.vehicle) {
    let closest = null;
    let minDist = 70;
    vehicles.forEach(v => {
      const d = Math.hypot(player.x - v.x, player.y - v.y);
      if (d < minDist) { minDist = d; closest = v; }
    });
    if (closest) {
      player.vehicle = closest;
      document.getElementById("val-veh").innerText = closest.name;
    }
  } else {
    player.x = player.vehicle.x + 45;
    player.vehicle = null;
    document.getElementById("val-veh").innerText = "A Pie";
  }
}

function interactDoor() {
  if (currentZone === "EXTERIOR") {
    buildings.forEach(b => {
      if (Math.hypot(player.x - b.doorX, player.y - b.doorY) < 50) {
        currentZone = b.id;
        player.x = 400; player.y = 400;
        if (player.vehicle) interactVehicle(); // Desmontar al entrar
      }
    });
  } else {
    if (player.y > 450) {
      const b = buildings.find(item => item.id === currentZone);
      currentZone = "EXTERIOR";
      player.x = b ? b.doorX : 1200;
      player.y = b ? b.doorY + 40 : 1200;
    } else if (Math.hypot(player.x - 600, player.y - 150) < 60) {
      document.getElementById("outfit-modal").style.display = "block";
    }
  }
}

function changeOutfit(col) { player.color = col; }
function closeOutfit() { document.getElementById("outfit-modal").style.display = "none"; }

// Lógica de Movimiento
function update() {
  let moveX = 0, moveY = 0;
  const activeSpeed = player.vehicle ? player.vehicle.speed : player.speed;

  if (keys.up) moveY -= 1;
  if (keys.down) moveY += 1;
  if (keys.left) moveX -= 1;
  if (keys.right) moveX += 1;

  if (moveX !== 0 || moveY !== 0) {
    const len = Math.hypot(moveX, moveY);
    player.dirX = moveX / len;
    player.dirY = moveY / len;
    player.angle = Math.atan2(player.dirY, player.dirX);

    player.x += player.dirX * activeSpeed;
    player.y += player.dirY * activeSpeed;

    if (player.vehicle) {
      player.vehicle.x = player.x;
      player.vehicle.y = player.y;
      player.vehicle.angle = player.angle;
    }
  }

  heliRotorAngle += 0.3;

  // Cámara centrada
  if (currentZone === "EXTERIOR") {
    camera.x = player.x - canvas.width / 2;
    camera.y = player.y - canvas.height / 2;
  } else {
    camera.x = 0; camera.y = 0;
  }

  // Proyectiles
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.x += b.vx;
    b.y += b.vy;
    b.life--;

    enemies.forEach(e => {
      if (e.active && Math.hypot(b.x - e.x, b.y - e.y) < (b.isCannon ? 35 : 20)) {
        e.hp -= b.isCannon ? 40 : 15;
        b.life = 0;
        if (e.hp <= 0) {
          e.active = false;
          targetsDefeated++;
          player.cash += 150;
          document.getElementById("val-targets").innerText = targetsDefeated;
          document.getElementById("val-cash").innerText = player.cash;
        }
      }
    });

    if (b.life <= 0) bullets.splice(i, 1);
  }

  // IA Enemigos
  enemies.forEach(e => {
    if (e.active) {
      e.x += e.dirX * 0.8;
      e.y += e.dirY * 0.8;
      if (Math.random() < 0.02) {
        e.dirX = (Math.random() - 0.5) * 2;
        e.dirY = (Math.random() - 0.5) * 2;
      }
    }
  });
}

// Dibujo Detallado de Vehículos
function drawVehicle(v) {
  ctx.save();
  ctx.translate(v.x - camera.x, v.y - camera.y);
  ctx.rotate(v.angle + Math.PI/2);

  if (v.type === "CAR_SUPER") {
    // Neón Inferior
    ctx.shadowColor = "#ff007f";
    ctx.shadowBlur = 15;
    ctx.fillStyle = v.color;
    ctx.fillRect(-v.w/2, -v.h/2, v.w, v.h);
    ctx.shadowBlur = 0;
    // Chasis / Alerón
    ctx.fillStyle = "#111";
    ctx.fillRect(-v.w/2 - 2, v.h/2 - 6, v.w + 4, 6); // Alerón
    ctx.fillStyle = "#222";
    ctx.fillRect(-v.w/2 + 4, -v.h/2 + 15, v.w - 8, 25); // Parabrisas
  } 
  else if (v.type === "CAR_SEDAN") {
    ctx.fillStyle = v.color;
    ctx.fillRect(-v.w/2, -v.h/2, v.w, v.h);
    ctx.fillStyle = "#111";
    ctx.fillRect(-v.w/2 + 3, -v.h/2 + 12, v.w - 6, 18);
  } 
  else if (v.type === "BIKE") {
    ctx.fillStyle = "#111";
    ctx.fillRect(-3, -v.h/2, 6, 12); // Rueda delantera
    ctx.fillRect(-3, v.h/2 - 12, 6, 12); // Rueda trasera
    ctx.fillStyle = v.color;
    ctx.fillRect(-v.w/2, -8, v.w, 20); // Cuerpo
  } 
  else if (v.type === "HELI") {
    // Cuerpo
    ctx.fillStyle = v.color;
    ctx.beginPath();
    ctx.ellipse(0, 0, v.w/2, v.h/3, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.fillRect(-4, v.h/3, 8, 30); // Cola
    // Hélice Principal
    ctx.save();
    ctx.rotate(heliRotorAngle);
    ctx.fillStyle = "rgba(255,255,255,0.7)";
    ctx.fillRect(-50, -3, 100, 6);
    ctx.restore();
  } 
  else if (v.type === "TANK") {
    // Orugas
    ctx.fillStyle = "#111";
    ctx.fillRect(-v.w/2 - 4, -v.h/2, 8, v.h);
    ctx.fillRect(v.w/2 - 4, -v.h/2, 8, v.h);
    // Cuerpo
    ctx.fillStyle = v.color;
    ctx.fillRect(-v.w/2, -v.h/2, v.w, v.h);
    // Torreta + Cañón
    ctx.fillStyle = "#223311";
    ctx.beginPath(); ctx.arc(0, 0, 16, 0, Math.PI*2); ctx.fill();
    ctx.fillRect(-4, -35, 8, 25); // Cañón
  }

  ctx.restore();
}

// Personaje
function drawCharacter(x, y, angle, bodyColor) {
  ctx.save();
  ctx.translate(x - camera.x, y - camera.y);
  ctx.rotate(angle);

  ctx.fillStyle = bodyColor;
  ctx.beginPath(); ctx.arc(0, 0, 12, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = "#fff"; ctx.lineWidth = 1.5; ctx.stroke();

  ctx.fillStyle = "#ffcc99";
  ctx.beginPath(); ctx.arc(0, 0, 6, 0, Math.PI * 2); ctx.fill();

  ctx.restore();
}

function render() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  if (currentZone === "EXTERIOR") {
    // Ciudad y Calles
    ctx.fillStyle = "#151828";
    ctx.fillRect(-camera.x, -camera.y, WORLD.width, WORLD.height);

    // Red de Carreteras
    ctx.fillStyle = "#22263a";
    ctx.fillRect(0 - camera.x, 1150 - camera.y, WORLD.width, 120);
    ctx.fillRect(1150 - camera.x, 0 - camera.y, 120, WORLD.height);

    ctx.strokeStyle = "#ffe600";
    ctx.setLineDash([20, 20]);
    ctx.beginPath();
    ctx.moveTo(0 - camera.x, 1210 - camera.y);
    ctx.lineTo(WORLD.width - camera.x, 1210 - camera.y);
    ctx.stroke(); ctx.setLineDash([]);

    // Edificios y Puertas
    buildings.forEach(b => {
      ctx.fillStyle = b.color;
      ctx.fillRect(b.x - camera.x, b.y - camera.y, b.w, b.h);
      ctx.strokeStyle = "#00ffff";
      ctx.lineWidth = 2;
      ctx.strokeRect(b.x - camera.x, b.y - camera.y, b.w, b.h);

      // Puerta Neón Interactiva
      ctx.fillStyle = "#ff007f";
      ctx.fillRect(b.doorX - camera.x - 15, b.doorY - camera.y - 10, 30, 10);
      ctx.fillStyle = "#00ffff";
      ctx.font = "10px sans-serif";
      ctx.fillText("🚪 [ENTRAR]", b.doorX - camera.x - 22, b.doorY - camera.y - 15);
      ctx.fillText(b.label, b.x - camera.x, b.y - camera.y - 8);
    });

    // Renderizar Vehículos
    vehicles.forEach(v => drawVehicle(v));

    // Pandilleros
    enemies.forEach(e => {
      if (e.active) drawCharacter(e.x, e.y, Math.atan2(e.dirY, e.dirX), "#ff3333");
    });

    // Balas
    bullets.forEach(b => {
      ctx.fillStyle = b.isCannon ? "#ff5500" : "#ffe600";
      ctx.beginPath();
      ctx.arc(b.x - camera.x, b.y - camera.y, b.isCannon ? 6 : 3, 0, Math.PI * 2);
      ctx.fill();
    });

  } else {
    // Interiores
    ctx.fillStyle = "#1a1829";
    ctx.fillRect(100, 50, canvas.width - 200, canvas.height - 100);
    ctx.strokeStyle = "#00ffff";
    ctx.lineWidth = 3;
    ctx.strokeRect(100, 50, canvas.width - 200, canvas.height - 100);

    ctx.fillStyle = "#552244";
    ctx.fillRect(560, 100, 80, 80);
    ctx.fillStyle = "#fff";
    ctx.font = "12px sans-serif";
    ctx.fillText("👔 Vestidor", 570, 145);

    ctx.fillStyle = "#ff007f";
    ctx.fillRect(canvas.width / 2 - 50, canvas.height - 80, 100, 20);
    ctx.fillText("SALIDA", canvas.width / 2 - 20, canvas.height - 90);
  }

  // Jugador a pie
  if (!player.vehicle) {
    drawCharacter(player.x, player.y, player.angle, player.color);
  }

  renderMinimap();
}

function renderMinimap() {
  mCtx.clearRect(0, 0, 110, 110);
  mCtx.fillStyle = "#080a14";
  mCtx.fillRect(0, 0, 110, 110);

  const scale = 110 / WORLD.width;

  if (currentZone === "EXTERIOR") {
    // Vehículos en el mapa
    vehicles.forEach(v => {
      mCtx.fillStyle = v.type === "TANK" ? "#445533" : "#00ffff";
      mCtx.fillRect(v.x * scale, v.y * scale, 3, 3);
    });

    // Enemigos
    enemies.forEach(e => {
      if (e.active) {
        mCtx.fillStyle = "#ff3333";
        mCtx.beginPath();
        mCtx.arc(e.x * scale, e.y * scale, 3, 0, Math.PI * 2);
        mCtx.fill();
      }
    });
  }

  mCtx.fillStyle = "#ff007f";
  mCtx.beginPath();
  mCtx.arc(player.x * scale, player.y * scale, 4, 0, Math.PI * 2);
  mCtx.fill();
}

function gameLoop() {
  update();
  render();
  requestAnimationFrame(gameLoop);
}

function toggleFullscreen() {
  if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(()=>{});
  else if (document.exitFullscreen) document.exitFullscreen();
}

gameLoop();
</script>
</body>
</html>
