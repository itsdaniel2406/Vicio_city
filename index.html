<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vice City 3D Synthwave</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; touch-action: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: monospace; color: #fff; }
        #canvas-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; }
        
        /* Bloqueo Vertical */
        #orient-warning { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #000; color: #ff00ff; z-index: 1000; justify-content: center; align-items: center; text-align: center; font-size: 20px; font-weight: bold; }
        @media (orientation: portrait) { #orient-warning { display: flex; } }

        /* HUD Overlay */
        .hud { position: absolute; top: 10px; left: 10px; right: 10px; display: flex; justify-content: space-between; z-index: 10; font-size: 14px; text-shadow: 0 0 5px #00ffff; pointer-events: none; }
        #fs-btn { position: absolute; top: 40px; right: 10px; padding: 6px 12px; background: rgba(0, 255, 255, 0.2); color: #00ffff; border: 1px solid #00ffff; border-radius: 4px; z-index: 10; font-weight: bold; cursor: pointer; }

        /* Controles Táctiles Overlay */
        .controls { position: absolute; bottom: 15px; width: 100%; display: flex; justify-content: space-between; padding: 0 20px; z-index: 10; pointer-events: none; }
        .dpad, .actions { pointer-events: auto; display: grid; gap: 5px; }
        .dpad { grid-template-columns: repeat(3, 55px); grid-template-rows: repeat(3, 55px); }
        .btn { background: rgba(255, 0, 255, 0.15); border: 2px solid #ff00ff; border-radius: 8px; color: #ff00ff; font-size: 22px; font-weight: bold; display: flex; align-items: center; justify-content: center; text-shadow: 0 0 8px #ff00ff; box-shadow: 0 0 10px rgba(255,0,255,0.3); }
        .btn:active { background: rgba(255, 0, 255, 0.5); }
        .btn-up { grid-column: 2; grid-row: 1; }
        .btn-left { grid-column: 1; grid-row: 2; }
        .btn-right { grid-column: 3; grid-row: 2; }
        .btn-down { grid-column: 2; grid-row: 3; }
        .actions { display: flex; gap: 15px; align-items: flex-end; }
        .btn-action { width: 65px; height: 65px; border-radius: 50%; border-color: #00ffff; color: #00ffff; text-shadow: 0 0 8px #00ffff; box-shadow: 0 0 10px rgba(0,255,255,0.3); }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="orient-warning">Gira tu dispositivo a HORIZONTAL 🔄</div>
    <div class="hud">
        <div style="color: #ff00ff;">VICE CITY 3D</div>
        <div id="mode-text" style="color: #00ffff;">MODO: A PIE</div>
    </div>
    <button id="fs-btn">PANTALLA COMPLETA</button>

    <div id="canvas-container"></div>

    <div class="controls">
        <div class="dpad">
            <div class="btn btn-up" id="btn-up">▲</div>
            <div class="btn btn-left" id="btn-left">◀</div>
            <div class="btn btn-right" id="btn-right">▶</div>
            <div class="btn btn-down" id="btn-down">▼</div>
        </div>
        <div class="actions">
            <div class="btn btn-action" id="btn-a">A</div>
        </div>
    </div>

    <script>
        // --- 1. CONFIGURACIÓN 3D (THREE.JS) ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x1a002a, 0.015); // Niebla Neón

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setClearColor(0x1a002a);
        container.appendChild(renderer.domElement);

        // Luces Neón
        const ambientLight = new THREE.AmbientLight(0xff00ff, 0.6);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0x00ffff, 0.8);
        dirLight.position.set(20, 40, 20);
        scene.add(dirLight);

        // --- 2. CONSTRUCCIÓN DE LA CIUDAD SYNTHWAVE ---
        // Suelo Grid Neón
        const gridHelper = new THREE.GridHelper(300, 60, 0xff00ff, 0x440044);
        gridHelper.position.y = 0;
        scene.add(gridHelper);

        // Edificios 3D
        const buildingGeo = new THREE.BoxGeometry(1, 1, 1);
        for (let i = 0; i < 80; i++) {
            const color = Math.random() > 0.5 ? 0x00ffff : 0xff00ff;
            const mat = new THREE.MeshLambertMaterial({ color: color, wireframe: true });
            const building = new THREE.Mesh(buildingGeo, mat);
            
            const h = 10 + Math.random() * 25;
            building.scale.set(8 + Math.random() * 6, h, 8 + Math.random() * 6);
            
            let x = (Math.random() - 0.5) * 250;
            let z = (Math.random() - 0.5) * 250;
            if (Math.abs(x) < 15) x += 30; // Dejar calle central
            
            building.position.set(x, h / 2, z);
            scene.add(building);
        }

        // --- 3. JUGADOR Y VEHÍCULO ---
        // Jugador (Cuerpo Neón)
        const playerGroup = new THREE.Group();
        const pMat = new THREE.MeshBasicMaterial({ color: 0x00ffff, wireframe: true });
        const pMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.5, 2, 8), pMat);
        pMesh.position.y = 1;
        playerGroup.add(pMesh);
        scene.add(playerGroup);
        playerGroup.position.set(0, 0, 10);

        // Vehículo (Auto Retro 3D)
        const carGroup = new THREE.Group();
        const carMat = new THREE.MeshLambertMaterial({ color: 0xff00ff });
        const carBody = new THREE.Mesh(new THREE.BoxGeometry(2, 1, 4), carMat);
        carBody.position.y = 0.5;
        carGroup.add(carBody);
        scene.add(carGroup);
        carGroup.position.set(5, 0, 0);

        // --- 4. CONTROLES Y LÓGICA DE JUEGO ---
        const keys = { up: false, down: false, left: false, right: false, action: false };
        let inVehicle = false;
        let speed = 0;

        function bindTouch(id, key) {
            const el = document.getElementById(id);
            el.addEventListener('touchstart', (e) => { e.preventDefault(); keys[key] = true; });
            el.addEventListener('touchend', (e) => { e.preventDefault(); keys[key] = false; });
        }
        bindTouch('btn-up', 'up'); bindTouch('btn-down', 'down');
        bindTouch('btn-left', 'left'); bindTouch('btn-right', 'right');
        
        document.getElementById('btn-a').addEventListener('touchstart', (e) => {
            e.preventDefault();
            toggleVehicle();
        });

        // Teclado PC
        window.addEventListener('keydown', (e) => {
            if (e.key === 'w' || e.key === 'ArrowUp') keys.up = true;
            if (e.key === 's' || e.key === 'ArrowDown') keys.down = true;
            if (e.key === 'a' || e.key === 'ArrowLeft') keys.left = false; // Ajustado giro
            if (e.key === 'd' || e.key === 'ArrowRight') keys.right = true;
            if (e.key === ' ') toggleVehicle();
        });
        window.addEventListener('keyup', (e) => {
            if (e.key === 'w' || e.key === 'ArrowUp') keys.up = false;
            if (e.key === 's' || e.key === 'ArrowDown') keys.down = false;
            if (e.key === 'a' || e.key === 'ArrowLeft') keys.left = false;
            if (e.key === 'd' || e.key === 'ArrowRight') keys.right = false;
        });

        function toggleVehicle() {
            const dist = playerGroup.position.distanceTo(carGroup.position);
            if (inVehicle) {
                inVehicle = false;
                playerGroup.position.copy(carGroup.position).add(new THREE.Vector3(2, 0, 0));
                playerGroup.visible = true;
                document.getElementById('mode-text').innerText = "MODO: A PIE";
            } else if (dist < 4) {
                inVehicle = true;
                playerGroup.visible = false;
                document.getElementById('mode-text').innerText = "MODO: CONDUCIENDO";
            }
        }

        // Pantalla Completa
        document.getElementById('fs-btn').addEventListener('click', () => {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
                if (screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape');
            } else { document.exitFullscreen(); }
        });

        // Resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // --- 5. BUCLE DE ANIMACIÓN Y CÁMARA 3ª PERSONA ---
        function animate() {
            requestAnimationFrame(animate);

            const activeObj = inVehicle ? carGroup : playerGroup;
            const turnSpeed = inVehicle ? 0.04 : 0.06;
            const maxSpeed = inVehicle ? 0.6 : 0.2;

            // Movimiento / Rotación
            if (keys.left) activeObj.rotation.y += turnSpeed;
            if (keys.right) activeObj.rotation.y -= turnSpeed;

            if (keys.up) speed = Math.min(speed + 0.02, maxSpeed);
            else if (keys.down) speed = Math.max(speed - 0.02, -maxSpeed / 2);
            else speed *= 0.9; // Fricción

            activeObj.translateZ(-speed);

            if (inVehicle) playerGroup.position.copy(carGroup.position);

            // Cámara en 3ª Persona (Sigue al objeto activo)
            const camOffset = new THREE.Vector3(0, 4, 8).applyMatrix4(activeObj.matrixWorld);
            camera.position.lerp(camOffset, 0.1);
            camera.lookAt(activeObj.position.clone().add(new THREE.Vector3(0, 1, 0)));

            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
