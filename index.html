<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Vice City 2.5D Retro</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; touch-action: none; }
        body, html { width: 100vw; height: 100vh; overflow: hidden; background: #05000a; font-family: monospace; color: #fff; }
        canvas { display: block; width: 100vw; height: 100vh; background: #110022; }

        #orient-warning { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #000; color: #ff00ff; z-index: 1000; justify-content: center; align-items: center; font-size: 20px; font-weight: bold; }
        @media (orientation: portrait) { #orient-warning { display: flex; } }

        .hud { position: absolute; top: 12px; left: 15px; right: 15px; display: flex; justify-content: space-between; z-index: 10; font-size: 14px; font-weight: bold; text-shadow: 0 0 5px #00ffff; pointer-events: none; }
        .hud-item { background: rgba(0,0,0,0.7); border: 1px solid #ff00ff; padding: 5px 10px; border-radius: 5px; color: #00ffff; }
        #mission-banner { position: absolute; top: 50px; left: 15px; background: rgba(0,0,0,0.8); border-left: 3px solid #ffff00; padding: 6px 12px; font-size: 12px; color: #fff; z-index: 10; max-width: 280px; }

        .controls { position: absolute; bottom: 15px; left: 0; width: 100%; display: flex; justify-content: space-between; padding: 0 20px; z-index: 10; pointer-events: none; }
        .dpad, .actions { pointer-events: auto; display: grid; gap: 5px; }
        .dpad { grid-template-columns: repeat(3, 50px); grid-template-rows: repeat(3, 50px); }
        .btn { background: rgba(255, 0, 255, 0.2); border: 2px solid #ff00ff; border-radius: 10px; color: #fff; font-size: 20px; font-weight: bold; display: flex; align-items: center; justify-content: center; text-shadow: 0 0 5px #ff00ff; }
        .btn:active { background: rgba(255, 0, 255, 0.6); }
        .btn-up { grid-column: 2; grid-row: 1; }
        .btn-left { grid-column: 1; grid-row: 2; }
        .btn-right { grid-column: 3; grid-row: 2; }
        .btn-down { grid-column: 2; grid-row: 3; }
        .actions { display: flex; gap: 12px; align-items: flex-end; }
        .btn-act { width: 55px; height: 55px; border-radius: 50%; border: 2px solid #00ffff; color: #00ffff; font-size: 20px; box-shadow: 0 0 8px #00ffff; }
    </style>
</head>
<body>

    <div id="orient-warning">Gira tu dispositivo a HORIZONTAL 🔄</div>

    <div class="hud">
        <div class="hud-item">SALUD: <span id="h-val" style="color:#ff00ff">100</span></div>
        <div class="hud-item">WANTED: <span id="w-val" style="color:#ffff00">⭐ 0</span></div>
        <div class="hud-item">DINERO: <span id="m-val" style="color:#00ff00">$0</span></div>
    </div>

    <div id="mission-banner"><b>MISIÓN:</b> <span id="m-text">Ve al marcador amarillo en el mapa.</span></div>

    <canvas id="game"></canvas>

    <div class="controls">
        <div class="dpad">
            <div class="btn btn-up" id="b-up">▲</div>
            <div class="btn btn-left" id="b-left">◀</div>
            <div class="btn btn-right" id="b-right">▶</div>
            <div class="btn btn-down" id="b-down">▼</div>
        </div>
        <div class="actions">
            <div class="btn btn-act" id="b-enter">🚗</div>
            <div class="btn btn-act" id="b-shoot" style="border-color:#ff007f; color:#ff007f;">🔫</div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');

        function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resize);
        resize();

        // --- ESTADO DEL JUEGO ---
        const player = { x: 500, y: 500, angle: 0, speed: 0, inCar: false, health: 100, money: 0, wanted: 0 };
        const keys = { up: false, down: false, left: false, right: false };

        // Vehículos (Jugador y Policía)
        const cars = [
            { x: 550, y: 500, angle: 0, speed: 0, color: '#ff007f', isPolice: false },
            { x: 100, y: 100, angle: 0, speed: 0, color: '#0022ff', isPolice: true }
        ];

        // Edificios (Mapa 2.5D)
        const buildings = [];
        for(let i=0; i<30; i++) {
            buildings.push({
                x: Math.floor(Math.random()*18)*100 + 50,
                y: Math.floor(Math.random()*18)*100 + 50,
                w: 80, h: 80, h3d: 25, color: '#1a102f'
            });
        }

        // Peatones (IA)
        const npcs = [];
        for(let i=0; i<25; i++) {
            npcs.push({ x: Math.random()*2000, y: Math.random()*2000, angle: Math.random()*6, speed: 1, state: 'walk' });
        }

        // Misión
        const mission = { x: 800, y: 800, step: 0 };

        // --- CONTROLES ---
        function setupBtn(id, key) {
            const el = document.getElementById(id);
            el.addEventListener('touchstart', (e) => { e.preventDefault(); keys[key] = true; });
            el.addEventListener('touchend', (e) => { e.preventDefault(); keys[key] = false; });
        }
        setupBtn('b-up', 'up'); setupBtn('b-down', 'down'); setupBtn('b-left', 'left'); setupBtn('b-right', 'right');

        document.getElementById('b-enter').addEventListener('touchstart', (e) => { e.preventDefault(); toggleCar(); });
        document.getElementById('b-shoot').addEventListener('touchstart', (e) => { e.preventDefault(); shoot(); });

        window.addEventListener('keydown', e => {
            if(e.key==='w'||e.key==='ArrowUp') keys.up=true;
            if(e.key==='s'||e.key==='ArrowDown') keys.down=true;
            if(e.key==='a'||e.key==='ArrowLeft') keys.left=true;
            if(e.key==='d'||e.key==='ArrowRight') keys.right=true;
            if(e.key===' ') toggleCar();
            if(e.key==='f') shoot();
        });
        window.addEventListener('keyup', e => {
            if(e.key==='w'||e.key==='ArrowUp') keys.up=false;
            if(e.key==='s'||e.key==='ArrowDown') keys.down=false;
            if(e.key==='a'||e.key==='ArrowLeft') keys.left=false;
            if(e.key==='d'||e.key==='ArrowRight') keys.right=false;
        });

        function toggleCar() {
            if(player.inCar) {
                player.inCar = false;
                player.x += 30;
            } else {
                cars.forEach(c => {
                    if(Math.hypot(c.x - player.x, c.y - player.y) < 40) {
                        player.inCar = true;
                        this.currentCar = c;
                    }
                });
            }
        }

        function shoot() {
            if(player.inCar) return;
            player.wanted = Math.min(5, player.wanted + 1);
            updateHUD();

            npcs.forEach((npc, i) => {
                if(Math.hypot(npc.x - player.x, npc.y - player.y) < 150) {
                    npcs.splice(i, 1); // Eliminar NPC
                    player.money += 100;
                    updateHUD();
                }
            });
        }

        function updateHUD() {
            document.getElementById('h-val').innerText = player.health;
            document.getElementById('w-val').innerText = "⭐ " + player.wanted;
            document.getElementById('m-val').innerText = "$" + player.money;
        }

        // --- BUCLE Y FÍSICAS ---
        function update() {
            const active = player.inCar ? this.currentCar : player;
            const maxSpd = player.inCar ? 7 : 2.5;

            if(keys.left) active.angle -= 0.06;
            if(keys.right) active.angle += 0.06;
            if(keys.up) active.speed = Math.min(active.speed + 0.2, maxSpd);
            else if(keys.down) active.speed = Math.max(active.speed - 0.2, -maxSpd/2);
            else active.speed *= 0.92;

            active.x += Math.cos(active.angle) * active.speed;
            active.y += Math.sin(active.angle) * active.speed;

            if(player.inCar) { player.x = this.currentCar.x; player.y = this.currentCar.y; }

            // IA Peatones
            npcs.forEach(npc => {
                if(player.wanted > 0 && Math.hypot(npc.x - player.x, npc.y - player.y) < 120) {
                    npc.angle = Math.atan2(npc.y - player.y, npc.x - player.x); // Huir
                    npc.speed = 2;
                }
                npc.x += Math.cos(npc.angle) * npc.speed;
                npc.y += Math.sin(npc.angle) * npc.speed;
            });

            // IA Policía
            const cop = cars[1];
            if(player.wanted > 0) {
                cop.angle = Math.atan2(player.y - cop.y, player.x - cop.x);
                cop.speed = 4.5;
                cop.x += Math.cos(cop.angle) * cop.speed;
                cop.y += Math.sin(cop.angle) * cop.speed;
                if(Math.hypot(cop.x - player.x, cop.y - player.y) < 30) {
                    player.health = Math.max(0, player.health - 0.5);
                    updateHUD();
                }
            }

            // Misión
            if(Math.hypot(mission.x - player.x, mission.y - player.y) < 40) {
                if(mission.step === 0) {
                    mission.step = 1;
                    player.money += 500;
                    mission.x = 200; mission.y = 1200;
                    document.getElementById('m-text').innerText = "¡Misión 1 Éxito (+$500)! Ve al siguiente punto.";
                    updateHUD();
                }
            }
        }

        // --- RENDERIZADO VISUAL ---
        function draw() {
            ctx.fillStyle = '#0a0015';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.save();
            // Cámara centrada
            ctx.translate(canvas.width/2 - player.x, canvas.height/2 - player.y);

            // 1. Asfalto / Rejilla
            ctx.strokeStyle = '#220044';
            ctx.lineWidth = 2;
            for(let x=0; x<2000; x+=100) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,2000); ctx.stroke(); }
            for(let y=0; y<2000; y+=100) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(2000,y); ctx.stroke(); }

            // 2. Marcador de Misión
            ctx.fillStyle = 'rgba(255, 255, 0, 0.4)';
            ctx.beginPath(); ctx.arc(mission.x, mission.y, 30, 0, Math.PI*2); ctx.fill();

            // 3. Edificios 2.5D (Efecto de Proyección de Altura)
            buildings.forEach(b => {
                // Sombra
                ctx.fillStyle = 'rgba(0,0,0,0.5)';
                ctx.fillRect(b.x + 10, b.y + 10, b.w, b.h);
                // Base
                ctx.fillStyle = b.color;
                ctx.fillRect(b.x, b.y, b.w, b.h);
                // Techo 2.5D (Proyección hacia afuera)
                const offX = (b.x - player.x) * 0.08;
                const offY = (b.y - player.y) * 0.08;
                ctx.fillStyle = '#00ffff';
                ctx.strokeRect(b.x + offX, b.y + offY, b.w, b.h);
            });

            // 4. Peatones
            npcs.forEach(npc => {
                ctx.fillStyle = '#ffff00';
                ctx.beginPath(); ctx.arc(npc.x, npc.y, 5, 0, Math.PI*2); ctx.fill();
            });

            // 5. Vehículos
            cars.forEach(c => {
                ctx.save();
                ctx.translate(c.x, c.y);
                ctx.rotate(c.angle);
                ctx.fillStyle = c.color;
                ctx.shadowColor = c.color; ctx.shadowBlur = 10;
                ctx.fillRect(-15, -8, 30, 16);
                ctx.restore();
            });

            // 6. Jugador (si está a pie)
            if(!player.inCar) {
                ctx.save();
                ctx.translate(player.x, player.y);
                ctx.rotate(player.angle);
                ctx.fillStyle = '#00ffff';
                ctx.shadowColor = '#00ffff'; ctx.shadowBlur = 8;
                ctx.beginPath(); ctx.arc(0, 0, 7, 0, Math.PI*2); ctx.fill();
                ctx.restore();
            }

            ctx.restore();
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }
        loop();
    </script>
</body>
</html>
