<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VICE CITY RETRO (HTML5) - Neon Drive</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; touch-action: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; background-color: #1a002a; font-family: 'Courier New', Courier, monospace; color: #fff; }
        #gameCanvas { display: block; filter: blur(0.5px) contrast(1.2); }
        
        /* Pantalla de Bloqueo Vertical */
        #orient-warning { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #000; color: #ff00ff; z-index: 1000; justify-content: center; align-items: center; text-align: center; font-size: 20px; font-weight: bold; padding: 20px; text-shadow: 0 0 10px #ff00ff; }
        @media (orientation: portrait) { #orient-warning { display: flex; } }

        /* HUD - Información del Juego (Arriba) */
        .hud-top { position: absolute; top: 10px; width: 100%; display: flex; justify-content: space-between; padding: 0 20px; z-index: 10; font-size: 14px; text-shadow: 0 0 5px #00ffff; }
        .hud-top .label { color: #ff00ff; text-shadow: 0 0 5px #ff00ff; }

        /* Botón Pantalla Completa */
        #fs-btn { position: absolute; top: 50px; right: 20px; padding: 5px 10px; background: rgba(0, 255, 255, 0.2); color: #00ffff; border: 1px solid #00ffff; border-radius: 4px; font-size: 12px; cursor: pointer; z-index: 20; text-shadow: 0 0 5px #00ffff; box-shadow: 0 0 10px rgba(0,255,255,0.5); }
        #fs-btn:active { background: rgba(0, 255, 255, 0.5); }

        /* Controles Táctiles (Overlay - Abajo) */
        .touch-controls { position: absolute; bottom: 15px; width: 100%; display: flex; justify-content: space-between; padding: 0 20px; z-index: 10; pointer-events: none; }
        .dpad, .action-buttons { pointer-events: auto; display: grid; gap: 5px; }

        /* D-Pad (Izquierda) */
        .dpad { grid-template-columns: repeat(3, 60px); grid-template-rows: repeat(3, 60px); }
        .btn { background: rgba(255, 0, 255, 0.1); border: 2px solid #ff00ff; border-radius: 10px; color: #ff00ff; font-size: 24px; font-weight: bold; display: flex; align-items: center; justify-content: center; text-shadow: 0 0 10px #ff00ff; box-shadow: 0 0 15px rgba(255,0,255,0.3); }
        .btn:active { background: rgba(255, 0, 255, 0.4); box-shadow: 0 0 20px rgba(255,0,255,0.7); }
        .btn-up { grid-column: 2; grid-row: 1; }
        .btn-left { grid-column: 1; grid-row: 2; }
        .btn-right { grid-column: 3; grid-row: 2; }
        .btn-down { grid-column: 2; grid-row: 3; }

        /* Botones Acción (Derecha - A/B) */
        .action-buttons { display: flex; gap: 15px; align-items: flex-end; }
        .btn-action { width: 70px; height: 70px; border-radius: 50%; border-color: #00ffff; color: #00ffff; font-size: 28px; text-shadow: 0 0 10px #00ffff; box-shadow: 0 0 15px rgba(0,255,255,0.3); }
        .btn-action:active { background: rgba(0, 255, 255, 0.4); box-shadow: 0 0 20px rgba(0,255,255,0.7); }
    </style>
</head>
<body>

    <div id="orient-warning">
        Gira tu dispositivo a posición HORIZONTAL para jugar 🔄
    </div>

    <div class="hud-top">
        <div><span class="label">VICE CITY RETRO:</span> NEON DRIVE</div>
        <div><span class="label">LIVES:</span> ❤️❤️🖤</div>
        <div><span class="label">MONEY:</span> $1200</div>
    </div>
    
    <button id="fs-btn">PANTALLA COMPLETA</button>

    <canvas id="gameCanvas"></canvas>

    <div class="touch-controls">
        <div class="dpad">
            <div class="btn btn-up" id="btn-up">▲</div>
            <div class="btn btn-left" id="btn-left">◀</div>
            <div class="btn btn-right" id="btn-right">▶</div>
            <div class="btn btn-down" id="btn-down">▼</div>
        </div>
        <div class="action-buttons">
            <div class="btn btn-action" id="btn-a">A</div>
            <div class="btn btn-action" id="btn-b">B</div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const fsBtn = document.getElementById('fs-btn');

        // Ajuste de canvas a la ventana
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            initializeMap(); // Regenerar mapa al cambiar tamaño
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Estado de controles
        const inputs = { up: false, down: false, left: false, right: false, actionA: false, actionB: false };

        // Mapeo Táctil
        function setupTouch(id, inputName) {
            const el = document.getElementById(id);
            el.addEventListener('touchstart', (e) => { e.preventDefault(); inputs[inputName] = true; });
            el.addEventListener('touchend', (e) => { e.preventDefault(); inputs[inputName] = false; });
        }
        setupTouch('btn-up', 'up'); setupTouch('btn-down', 'down');
        setupTouch('btn-left', 'left'); setupTouch('btn-right', 'right');
        setupTouch('btn-a', 'actionA'); setupTouch('btn-b', 'actionB');

        // Mapeo Teclado (PC)
        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowUp' || e.key === 'w') inputs.up = true;
            if (e.key === 'ArrowDown' || e.key === 's') inputs.down = true;
            if (e.key === 'ArrowLeft' || e.key === 'a') inputs.left = true;
            if (e.key === 'ArrowRight' || e.key === 'd') inputs.right = true;
        });
        window.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowUp' || e.key === 'w') inputs.up = false;
            if (e.key === 'ArrowDown' || e.key === 's') inputs.down = false;
            if (e.key === 'ArrowLeft' || e.key === 'a') inputs.left = false;
            if (e.key === 'ArrowRight' || e.key === 'd') inputs.right = false;
        });

        // Pantalla Completa y Bloqueo de Orientación
        fsBtn.addEventListener('click', async () => {
            try {
                if (!document.fullscreenElement) {
                    await document.documentElement.requestFullscreen();
                    if (screen.orientation && screen.orientation.lock) {
                        await screen.orientation.lock('landscape');
                    }
                } else { document.exitFullscreen(); }
            } catch (err) { console.log("Error de pantalla completa:", err); }
        });

        // --- CONFIGURACIÓN DEL JUEGO (SYNTHWAVE ART) ---
        const colors = {
            bg: '#1a002a',
            grid: '#ff00ff', // Rosa Neón
            buildings: '#00ffff', // Cian Neón
            player: '#ff00ff', // Rosa Neón (Auto)
            text: '#fff'
        };

        const mapSize = { width: 3000, height: 2000 };
        let buildings = [];
        let palmTrees = [];

        function initializeMap() {
            buildings = [];
            palmTrees = [];
            // Generar edificios de neón
            for (let i = 0; i < 60; i++) {
                buildings.push({
                    x: Math.random() * mapSize.width,
                    y: Math.random() * mapSize.height,
                    width: 80 + Math.random() * 150,
                    height: 150 + Math.random() * 300,
                    color: Math.random() > 0.5 ? colors.buildings : colors.grid
                });
            }
            // Generar palmeras de neón
            for (let i = 0; i < 100; i++) {
                palmTrees.push({
                    x: Math.random() * mapSize.width,
                    y: Math.random() * mapSize.height,
                    color: colors.buildings
                });
            }
        }

        const player = {
            x: mapSize.width / 2,
            y: mapSize.height / 2,
            angle: 0,
            speed: 0,
            maxSpeed: 6,
            color: colors.player
        };

        // --- FUNCIONES DE DIBUJO CON EFECTO NEÓN ---
        function drawNeonLine(x1, y1, x2, y2, color, width) {
            ctx.shadowBlur = 15;
            ctx.shadowColor = color;
            ctx.strokeStyle = color;
            ctx.lineWidth = width;
            ctx.beginPath();
            ctx.moveTo(x1, y1);
            ctx.lineTo(x2, y2);
            ctx.stroke();
            ctx.shadowBlur = 0; // Reset
        }

        function drawPalmTree(x, y, color) {
            drawNeonLine(x, y, x, y - 60, color, 3); // Tronco
            for(let i = 0; i < 6; i++) { // Hojas
                ctx.save();
                ctx.translate(x, y-60);
                ctx.rotate(i * Math.PI / 3);
                drawNeonLine(0, 0, 20, 10, color, 2);
                ctx.restore();
            }
        }

        // --- BUCLE PRINCIPAL DEL JUEGO ---
        function update() {
            // Física del auto (Rotación y velocidad)
            if (inputs.left) player.angle -= 0.05;
            if (inputs.right) player.angle += 0.05;

            if (inputs.up) {
                player.speed = Math.min(player.speed + 0.2, player.maxSpeed);
            } else if (inputs.down) {
                player.speed = Math.max(player.speed - 0.1, -player.maxSpeed / 2);
            } else {
                player.speed *= 0.96; // Fricción
            }

            // Mover jugador basándose en ángulo
            player.x += Math.cos(player.angle) * player.speed;
            player.y += Math.sin(player.angle) * player.speed;

            // Límites del mapa
            player.x = Math.max(0, Math.min(player.x, mapSize.width));
            player.y = Math.max(0, Math.min(player.y, mapSize.height));
        }

        function draw() {
            // Fondo oscuro Synthwave
            ctx.fillStyle = colors.bg;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Cámara centrada en el jugador
            const camX = canvas.width / 2 - player.x;
            const camY = canvas.height / 2 - player.y;

            ctx.save();
            ctx.translate(camX, camY);

            // 1. Dibujar Cuadrícula de Suelo (Rosa Neón)
            const gridSize = 100;
            ctx.strokeStyle = colors.grid;
            ctx.lineWidth = 1;
            ctx.globalAlpha = 0.4;
            for (let x = 0; x < mapSize.width; x += gridSize) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, mapSize.height); ctx.stroke();
            }
            for (let y = 0; y < mapSize.height; y += gridSize) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(mapSize.width, y); ctx.stroke();
            }
            ctx.globalAlpha = 1.0;

            // 2. Dibujar Palmeras
            palmTrees.forEach(palm => drawPalmTree(palm.x, palm.y, palm.color));

            // 3. Dibujar Edificios con Resplandor
            buildings.forEach(b => {
                ctx.save();
                ctx.translate(b.x, b.y);
                // Efecto Neón
                ctx.shadowBlur = 20;
                ctx.shadowColor = b.color;
                ctx.strokeStyle = b.color;
                ctx.lineWidth = 3;
                ctx.strokeRect(-b.width / 2, -b.height, b.width, b.height);
                
                // Ventanas (puntos de luz)
                ctx.fillStyle = b.color;
                ctx.shadowBlur = 10;
                for(let wy = -b.height + 20; wy < -20; wy+=40) {
                    for(let wx = -b.width/2 + 20; wx < b.width/2 - 20; wx+=30) {
                        if(Math.random() > 0.3) ctx.fillRect(wx, wy, 8, 12);
                    }
                }
                ctx.restore();
            });

            // 4. Dibujar Jugador (Auto Rosa Neón)
            ctx.save();
            ctx.translate(player.x, player.y);
            ctx.rotate(player.angle);
            // Efecto Neón Auto
            ctx.shadowBlur = 25;
            ctx.shadowColor = player.color;
            ctx.fillStyle = player.color;
            ctx.fillRect(-25, -15, 50, 30); // Cuerpo
            // Luces delanteras
            ctx.shadowColor = '#fff';
            ctx.fillStyle = '#fff';
            ctx.fillRect(20, -12, 8, 6);
            ctx.fillRect(20, 6, 8, 6);
            ctx.restore();

            ctx.restore(); // Restaurar Cámara
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        initializeMap();
        gameLoop();
    </script>
</body>
</html>
