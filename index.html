<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Vicio City v2.9.1 - Responsivo</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #0b0f19;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      background-color: #121826;
      overflow: hidden;
    }

    canvas#gameCanvas {
      display: block;
      width: 100%;
      height: 100%;
      background-color: #1a2332;
    }

    /* --- UI: TOP LEFT HUD --- */
    .hud-panel {
      position: absolute;
      top: 10px;
      left: 10px;
      width: min(220px, 45vw);
      background: rgba(10, 15, 26, 0.85);
      border: 1.5px solid #ff007f;
      border-radius: 8px;
      padding: 8px;
      box-shadow: 0 0 8px rgba(255, 0, 127, 0.4);
      z-index: 10;
      font-size: 11px;
    }

    .hud-header {
      font-weight: bold;
      font-size: 12px;
      text-transform: uppercase;
      background: linear-gradient(90deg, #ff007f, #00f0ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 4px;
    }

    .stat-row {
      display: flex;
      justify-content: space-between;
      color: #33ffff;
      margin-bottom: 3px;
    }

    .mission-box {
      margin-top: 6px;
      background: rgba(255, 204, 0, 0.15);
      border: 1px solid #ffcc00;
      border-radius: 4px;
      padding: 4px;
      font-size: 10px;
      color: #ffea79;
      line-height: 1.2;
    }

    /* --- UI: TOP RIGHT PANEL (BOTONES & MINIMAPA) --- */
    .top-right-panel {
      position: absolute;
      top: 10px;
      right: 10px;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 8px;
      z-index: 10;
    }

    .top-buttons {
      display: flex;
      gap: 5px;
    }

    .btn-ui {
      background: rgba(10, 15, 26, 0.8);
      border: 1px solid #00f0ff;
      color: #00f0ff;
      padding: 4px 8px;
      border-radius: 5px;
      font-size: 10px;
      cursor: pointer;
      font-weight: bold;
    }

    .btn-ui:active {
      background: #00f0ff;
      color: #000;
    }

    .minimap-container {
      width: clamp(70px, 18vw, 110px);
      height: clamp(70px, 18vw, 110px);
      border: 2px solid #ff007f;
      border-radius: 50%;
      overflow: hidden;
      box-shadow: 0 0 8px rgba(255, 0, 127, 0.5);
      background: #000;
    }

    #minimap {
      width: 100%;
      height: 100%;
    }

    /* --- UI: ARMAS Y CONTROLES INFERIORES --- */
    .weapon-selector-container {
      position: absolute;
      bottom: 15px;
      right: 15px;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      z-index: 20;
    }

    .weapon-dropdown {
      display: none;
      flex-direction: column;
      gap: 5px;
      margin-bottom: 8px;
      background: rgba(10, 15, 26, 0.95);
      border: 1.5px solid #00f0ff;
      border-radius: 8px;
      padding: 6px;
      box-shadow: 0 0 10px rgba(0, 240, 255, 0.4);
    }

    .weapon-option {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid transparent;
      padding: 6px 10px;
      border-radius: 5px;
      cursor: pointer;
      min-width: 130px;
    }

    .weapon-option.active {
      border-color: #ff007f;
      background: rgba(255, 0, 127, 0.25);
    }

    .btn-weapon-active {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: rgba(10, 15, 26, 0.9);
      border: 2px solid #ff007f;
      color: #fff;
      font-size: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      box-shadow: 0 0 10px rgba(255, 0, 127, 0.6);
    }

    /* --- CONTROLES MOVILES (D-PAD) --- */
    .dpad {
      position: absolute;
      bottom: 15px;
      left: 15px;
      width: 100px;
      height: 100px;
      z-index: 10;
    }

    .dpad-btn {
      position: absolute;
      width: 32px;
      height: 32px;
      background: rgba(0, 240, 255, 0.2);
      border: 1.5px solid #00f0ff;
      border-radius: 6px;
      color: #00f0ff;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 12px;
      cursor: pointer;
    }

    .dpad-btn:active {
      background: #00f0ff;
      color: #000;
    }

    .dpad-up    { top: 0; left: 34px; }
    .dpad-down  { bottom: 0; left: 34px; }
    .dpad-left  { top: 34px; left: 0; }
    .dpad-right { top: 34px; right: 0; }
  </style>
</head>
<body>

  <div id="game-container">
    <canvas id="gameCanvas"></canvas>

    <div class="hud-panel">
      <div class="hud-header">VICIO CITY v2.9.1</div>
      <div class="stat-row"><span>LVL: 1</span> <span>XP: 95/100</span></div>
      <div class="stat-row"><span>HP: 100/100</span> <span>CASH: $960</span></div>
      <div class="stat-row"><span>WANTED:</span> <span style="color: #ffcc00;">★☆☆☆☆</span></div>
      <div class="mission-box">
        🎯 <b>MISIÓN:</b> Elimina 3 Pandilleros (0/3)
      </div>
    </div>

    <div class="top-right-panel">
      <div class="top-buttons">
        <button class="btn-ui" onclick="toggleFullScreen()">FULL</button>
        <button class="btn-ui">GUARDAR</button>
        <button class="btn-ui">CARGAR</button>
      </div>
      <div class="minimap-container">
        <canvas id="minimap" width="110" height="110"></canvas>
      </div>
    </div>

    <div class="weapon-selector-container">
      <div class="weapon-dropdown" id="weaponDropdown"></div>
      <button class="btn-weapon-active" id="btnWeaponActive" onclick="toggleWeaponMenu()">🔫</button>
    </div>

    <div class="dpad">
      <div class="dpad-btn dpad-up" id="btnUp">▲</div>
      <div class="dpad-btn dpad-left" id="btnLeft">◀</div>
      <div class="dpad-btn dpad-right" id="btnRight">▶</div>
      <div class="dpad-btn dpad-down" id="btnDown">▼</div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const minimapCanvas = document.getElementById('minimap');
    const minimapCtx = minimapCanvas.getContext('2d');

    // Ajuste dinámico del tamaño del Canvas
    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // Configuración de Pantalla Completa
    function toggleFullScreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(()=>{});
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
      }
    }

    // --- ARMAS ---
    const armas = [
      { id: 'pistola', nombre: 'Pistola 9mm', icono: '🔫', daño: 25 },
      { id: 'escopeta', nombre: 'Escopeta', icono: '💥', daño: 60 },
      { id: 'subfusil', nombre: 'Subfusil MAC', icono: '⚡', daño: 18 }
    ];
    let armaEquipada = armas[0];

    // --- JUGADOR ---
    const jugador = {
      x: window.innerWidth / 2,
      y: window.innerHeight / 2,
      radio: 10,
      color: '#ff9999',
      velocidad: 3
    };

    // --- ARBOLES ---
    const arboles = [
      { x: 120, y: 100, r: 20 }, { x: 180, y: 130, r: 18 }, { x: 100, y: 180, r: 22 },
      { x: 450, y: 120, r: 20 }, { x: 520, y: 100, r: 24 },
      { x: 200, y: 400, r: 22 }, { x: 260, y: 430, r: 18 }
    ];

    // --- NPCS (Velocidad ajustada) ---
    const npcs = [
      { x: 250, y: 300, vx: 0.8, vy: 0, color: '#e0a080', tipo: 'peaton' },
      { x: 400, y: 200, vx: 0, vy: 0.7, color: '#ff3366', tipo: 'pandillero' }
    ];

    // Controles por teclado y táctiles
    const teclas = { w: false, a: false, s: false, d: false };

    window.addEventListener('keydown', e => {
      if (['w','W','ArrowUp'].includes(e.key)) teclas.w = true;
      if (['a','A','ArrowLeft'].includes(e.key)) teclas.a = true;
      if (['s','S','ArrowDown'].includes(e.key)) teclas.s = true;
      if (['d','D','ArrowRight'].includes(e.key)) teclas.d = true;
    });

    window.addEventListener('keyup', e => {
      if (['w','W','ArrowUp'].includes(e.key)) teclas.w = false;
      if (['a','A','ArrowLeft'].includes(e.key)) teclas.a = false;
      if (['s','S','ArrowDown'].includes(e.key)) teclas.s = false;
      if (['d','D','ArrowRight'].includes(e.key)) teclas.d = false;
    });

    // Controles táctiles D-Pad
    const setupTouchBtn = (id, key) => {
      const btn = document.getElementById(id);
      btn.addEventListener('touchstart', (e) => { e.preventDefault(); teclas[key] = true; });
      btn.addEventListener('touchend', (e) => { e.preventDefault(); teclas[key] = false; });
    };
    setupTouchBtn('btnUp', 'w');
    setupTouchBtn('btnDown', 's');
    setupTouchBtn('btnLeft', 'a');
    setupTouchBtn('btnRight', 'd');

    // Menú desplegable de armas
    function renderWeaponMenu() {
      const dropdown = document.getElementById('weaponDropdown');
      dropdown.innerHTML = '';
      armas.forEach(a => {
        const item = document.createElement('div');
        item.className = `weapon-option ${a.id === armaEquipada.id ? 'active' : ''}`;
        item.onclick = () => seleccionarArma(a);
        item.innerHTML = `
          <span>${a.icono}</span>
          <div style="display:flex; flex-direction:column; font-size:10px;">
            <b>${a.nombre}</b>
            <span style="color:#aaa;">Daño: ${a.daño}</span>
          </div>
        `;
        dropdown.appendChild(item);
      });
    }

    function toggleWeaponMenu() {
      const dropdown = document.getElementById('weaponDropdown');
      dropdown.style.display = (dropdown.style.display === 'flex') ? 'none' : 'flex';
    }

    function seleccionarArma(arma) {
      armaEquipada = arma;
      document.getElementById('btnWeaponActive').innerText = arma.icono;
      toggleWeaponMenu();
      renderWeaponMenu();
    }

    // Actualización del bucle de juego
    function actualizar() {
      if (teclas.w && jugador.y > jugador.radio) jugador.y -= jugador.velocidad;
      if (teclas.s && jugador.y < canvas.height - jugador.radio) jugador.y += jugador.velocidad;
      if (teclas.a && jugador.x > jugador.radio) jugador.x -= jugador.velocidad;
      if (teclas.d && jugador.x < canvas.width - jugador.radio) jugador.x += jugador.velocidad;

      npcs.forEach(npc => {
        npc.x += npc.vx;
        npc.y += npc.vy;
        if (npc.x < 20 || npc.x > canvas.width - 20) npc.vx *= -1;
        if (npc.y < 20 || npc.y > canvas.height - 20) npc.vy *= -1;
      });
    }

    // Renderizado
    function renderizar() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Dibujar Árboles
      arboles.forEach(a => {
        ctx.beginPath();
        ctx.arc(a.x, a.y, a.r, 0, Math.PI * 2);
        ctx.fillStyle = '#2e7d32';
        ctx.fill();
        ctx.strokeStyle = '#1b5e20';
        ctx.lineWidth = 2;
        ctx.stroke();
      });

      // Dibujar NPCs
      npcs.forEach(npc => {
        ctx.beginPath();
        ctx.arc(npc.x, npc.y, 8, 0, Math.PI * 2);
        ctx.fillStyle = npc.color;
        ctx.fill();
      });

      // Dibujar Jugador
      ctx.beginPath();
      ctx.arc(jugador.x, jugador.y, jugador.radio, 0, Math.PI * 2);
      ctx.fillStyle = jugador.color;
      ctx.fill();
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 2;
      ctx.stroke();

      // Renderizar Minimapa
      renderizarMinimapa();
    }

    function renderizarMinimapa() {
      minimapCtx.fillStyle = '#0a0f1a';
      minimapCtx.fillRect(0, 0, 110, 110);

      const escalaX = 110 / canvas.width;
      const escalaY = 110 / canvas.height;

      // Jugador en minimapa
      minimapCtx.fillStyle = '#ff007f';
      minimapCtx.beginPath();
      minimapCtx.arc(jugador.x * escalaX, jugador.y * escalaY, 3, 0, Math.PI * 2);
      minimapCtx.fill();
    }

    function gameLoop() {
      actualizar();
      renderizar();
      requestAnimationFrame(gameLoop);
    }

    renderWeaponMenu();
    gameLoop();
  </script>
</body>
</html>
