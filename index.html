<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Vicio City v2.9.3 - Restaurado</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      background-color: #0b0f19;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
    }

    #game-container {
      position: relative;
      width: 100%;
      height: 100%;
      background-color: #121826;
      overflow: hidden;
    }

    canvas#gameCanvas {
      display: block;
      width: 100%;
      height: 100%;
      background-color: #151c28;
    }

    /* Advertencia de giro en pantalla vertical */
    #rotate-warning {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #0b0f19;
      z-index: 9999;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
    }

    @media screen and (orientation: portrait) and (max-width: 768px) {
      #rotate-warning { display: flex; }
    }

    /* --- HUD TOP LEFT --- */
    .hud-panel {
      position: absolute;
      top: 10px;
      left: 10px;
      width: clamp(170px, 24vw, 230px);
      background: rgba(10, 15, 26, 0.88);
      border: 2px solid #ff007f;
      border-radius: 8px;
      padding: 6px 10px;
      box-shadow: 0 0 10px rgba(255, 0, 127, 0.4);
      z-index: 10;
      font-size: 11px;
    }

    .hud-header {
      font-weight: bold;
      font-size: 12px;
      text-transform: uppercase;
      background: linear-gradient(90deg, #ff007f, #00f0ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 4px;
    }

    .stat-row {
      display: flex;
      justify-content: space-between;
      color: #33ffff;
      margin-bottom: 3px;
      font-size: 10px;
    }

    .mission-box {
      margin-top: 5px;
      background: rgba(255, 204, 0, 0.15);
      border: 1px solid #ffcc00;
      border-radius: 4px;
      padding: 4px;
      font-size: 9px;
      color: #ffea79;
    }

    /* --- HUD TOP RIGHT --- */
    .top-right-panel {
      position: absolute;
      top: 10px;
      right: 10px;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 6px;
      z-index: 10;
    }

    .top-buttons {
      display: flex;
      gap: 4px;
    }

    .btn-ui {
      background: rgba(10, 15, 26, 0.85);
      border: 1.5px solid #00f0ff;
      color: #00f0ff;
      padding: 4px 8px;
      border-radius: 5px;
      font-size: 10px;
      cursor: pointer;
      font-weight: bold;
    }

    .btn-ui:active {
      background: #00f0ff;
      color: #000;
    }

    .minimap-container {
      width: clamp(75px, 15vw, 105px);
      height: clamp(75px, 15vw, 105px);
      border: 2px solid #ff007f;
      border-radius: 50%;
      overflow: hidden;
      box-shadow: 0 0 10px rgba(255, 0, 127, 0.5);
      background: #000;
    }

    #minimap {
      width: 100%;
      height: 100%;
    }

    /* --- MENÚ DE ARMAS --- */
    .weapon-selector-container {
      position: absolute;
      bottom: 15px;
      right: 15px;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      z-index: 20;
    }

    .weapon-dropdown {
      display: none;
      flex-direction: column;
      gap: 4px;
      margin-bottom: 6px;
      background: rgba(10, 15, 26, 0.95);
      border: 1.5px solid #00f0ff;
      border-radius: 8px;
      padding: 6px;
      box-shadow: 0 0 10px rgba(0, 240, 255, 0.4);
    }

    .weapon-option {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.05);
      padding: 5px 8px;
      border-radius: 4px;
      cursor: pointer;
      min-width: 120px;
    }

    .weapon-option.active {
      border: 1px solid #ff007f;
      background: rgba(255, 0, 127, 0.25);
    }

    .btn-weapon-active {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: rgba(10, 15, 26, 0.9);
      border: 2px solid #ff007f;
      color: #fff;
      font-size: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      box-shadow: 0 0 10px rgba(255, 0, 127, 0.6);
    }

    /* --- D-PAD --- */
    .dpad {
      position: absolute;
      bottom: 15px;
      left: 15px;
      width: 96px;
      height: 96px;
      z-index: 10;
    }

    .dpad-btn {
      position: absolute;
      width: 32px;
      height: 32px;
      background: rgba(0, 240, 255, 0.2);
      border: 1.5px solid #00f0ff;
      border-radius: 6px;
      color: #00f0ff;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 11px;
    }

    .dpad-btn:active {
      background: #00f0ff;
      color: #000;
    }

    .dpad-up    { top: 0; left: 32px; }
    .dpad-down  { bottom: 0; left: 32px; }
    .dpad-left  { top: 32px; left: 0; }
    .dpad-right { top: 32px; right: 0; }
  </style>
</head>
<body>

  <div id="rotate-warning">
    <span style="font-size: 35px;">🔄</span>
    <h2 style="margin-top: 10px;">Por favor, gira tu dispositivo</h2>
    <p style="margin-top: 5px; font-size: 11px; color: #aaa;">Juega en modo horizontal para ver todo el mapa correctamente.</p>
  </div>

  <div id="game-container">
    <canvas id="gameCanvas"></canvas>

    <!-- HUD Izquierdo -->
    <div class="hud-panel">
      <div class="hud-header">VICIO CITY v2.9.3</div>
      <div class="stat-row"><span>LVL: 1</span> <span>XP: 95/100</span></div>
      <div class="stat-row"><span>HP: 100/100</span> <span>CASH: $960</span></div>
      <div class="stat-row"><span>WANTED:</span> <span style="color: #ffcc00;">★☆☆☆☆</span></div>
      <div class="mission-box">
        🎯 <b>MISIÓN:</b> Elimina 3 Pandilleros en la ciudad (0/3)
      </div>
    </div>

    <!-- HUD Derecho -->
    <div class="top-right-panel">
      <div class="top-buttons">
        <button class="btn-ui" id="btnFull">FULL</button>
        <button class="btn-ui">GUARDAR</button>
        <button class="btn-ui">CARGAR</button>
      </div>
      <div class="minimap-container">
        <canvas id="minimap" width="105" height="105"></canvas>
      </div>
    </div>

    <!-- Menú Desplegable de Armas -->
    <div class="weapon-selector-container">
      <div class="weapon-dropdown" id="weaponDropdown"></div>
      <button class="btn-weapon-active" id="btnWeaponActive" onclick="toggleWeaponMenu()">🎯</button>
    </div>

    <!-- D-Pad -->
    <div class="dpad">
      <div class="dpad-btn dpad-up" id="btnUp">▲</div>
      <div class="dpad-btn dpad-left" id="btnLeft">◀</div>
      <div class="dpad-btn dpad-right" id="btnRight">▶</div>
      <div class="dpad-btn dpad-down" id="btnDown">▼</div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const minimapCanvas = document.getElementById('minimap');
    const minimapCtx = minimapCanvas.getContext('2d');

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // Pantalla Completa + Orientación
    document.getElementById('btnFull').addEventListener('click', async () => {
      try {
        if (!document.fullscreenElement) {
          await document.documentElement.requestFullscreen();
          if (screen.orientation && screen.orientation.lock) {
            await screen.orientation.lock('landscape').catch(() => {});
          }
        } else {
          await document.exitFullscreen();
        }
      } catch (e) {}
    });

    // --- ARMAS ---
    const armas = [
      { id: 'pistola', nombre: 'Pistola 9mm', icono: '🔫', daño: 25 },
      { id: 'escopeta', nombre: 'Escopeta', icono: '💥', daño: 60 },
      { id: 'subfusil', nombre: 'Subfusil MAC', icono: '⚡', daño: 18 }
    ];
    let armaEquipada = armas[0];

    // --- ENTIDADES Y DETALLES ---
    const jugador = {
      x: window.innerWidth / 2,
      y: window.innerHeight / 2,
      radio: 11,
      color: '#ff9999',
      velocidad: 3.2
    };

    const edificaciónes = [
      { x: 50, y: 40, w: 180, h: 120, color: '#101726', borde: '#00f0ff' },
      { x: 280, y: 40, w: 220, h: 120, color: '#101726', borde: '#ff007f' },
      { x: 700, y: 40, w: 250, h: 140, color: '#101726', borde: '#00f0ff' }
    ];

    const arboles = [
      { x: 120, y: 220, r: 22 }, { x: 180, y: 240, r: 18 }, { x: 90, y: 270, r: 24 },
      { x: 550, y: 200, r: 20 }, { x: 610, y: 180, r: 25 }, { x: 670, y: 220, r: 19 },
      { x: 200, y: 480, r: 22 }, { x: 260, y: 510, r: 20 }, { x: 140, y: 520, r: 25 }
    ];

    const autos = [
      { x: 600, y: window.innerHeight * 0.62 + 8, w: 42, h: 22, color: '#ff0055', vx: -1.2 },
      { x: 150, y: window.innerHeight * 0.62 + 38, w: 42, h: 22, color: '#00ccff', vx: 1.5 }
    ];

    const npcs = [
      { x: 300, y: 260, vx: 0.7, vy: 0, color: '#e0a080', tipo: 'peaton' },
      { x: 750, y: 280, vx: -0.6, vy: 0, color: '#e0a080', tipo: 'peaton' },
      { x: 420, y: 220, vx: 0, vy: 0.6, color: '#ff3366', tipo: 'pandillero' }
    ];

    // CONTROLES
    const teclas = { w: false, a: false, s: false, d: false };

    window.addEventListener('keydown', e => {
      if (['w','W','ArrowUp'].includes(e.key)) teclas.w = true;
      if (['a','A','ArrowLeft'].includes(e.key)) teclas.a = true;
      if (['s','S','ArrowDown'].includes(e.key)) teclas.s = true;
      if (['d','D','ArrowRight'].includes(e.key)) teclas.d = true;
    });

    window.addEventListener('keyup', e => {
      if (['w','W','ArrowUp'].includes(e.key)) teclas.w = false;
      if (['a','A','ArrowLeft'].includes(e.key)) teclas.a = false;
      if (['s','S','ArrowDown'].includes(e.key)) teclas.s = false;
      if (['d','D','ArrowRight'].includes(e.key)) teclas.d = false;
    });

    const bindTouch = (id, key) => {
      const el = document.getElementById(id);
      el.addEventListener('touchstart', (e) => { e.preventDefault(); teclas[key] = true; });
      el.addEventListener('touchend', (e) => { e.preventDefault(); teclas[key] = false; });
    };
    bindTouch('btnUp', 'w');
    bindTouch('btnDown', 's');
    bindTouch('btnLeft', 'a');
    bindTouch('btnRight', 'd');

    // ARMAS UI
    function renderWeaponMenu() {
      const dropdown = document.getElementById('weaponDropdown');
      dropdown.innerHTML = '';
      armas.forEach(a => {
        const item = document.createElement('div');
        item.className = `weapon-option ${a.id === armaEquipada.id ? 'active' : ''}`;
        item.onclick = () => seleccionarArma(a);
        item.innerHTML = `
          <span style="font-size:16px;">${a.icono}</span>
          <div style="display:flex; flex-direction:column; font-size:9px;">
            <b>${a.nombre}</b>
            <span style="color:#aaa;">Daño: ${a.daño}</span>
          </div>
        `;
        dropdown.appendChild(item);
      });
    }

    function toggleWeaponMenu() {
      const dropdown = document.getElementById('weaponDropdown');
      dropdown.style.display = (dropdown.style.display === 'flex') ? 'none' : 'flex';
    }

    function seleccionarArma(arma) {
      armaEquipada = arma;
      document.getElementById('btnWeaponActive').innerText = arma.icono;
      toggleWeaponMenu();
      renderWeaponMenu();
    }

    // UPDATE
    function actualizar() {
      if (teclas.w && jugador.y > jugador.radio) jugador.y -= jugador.velocidad;
      if (teclas.s && jugador.y < canvas.height - jugador.radio) jugador.y += jugador.velocidad;
      if (teclas.a && jugador.x > jugador.radio) jugador.x -= jugador.velocidad;
      if (teclas.d && jugador.x < canvas.width - jugador.radio) jugador.x += jugador.velocidad;

      // Animación lenta de NPCs
      npcs.forEach(npc => {
        npc.x += npc.vx;
        npc.y += npc.vy;
        if (npc.x < 30 || npc.x > canvas.width - 30) npc.vx *= -1;
        if (npc.y < 30 || npc.y > canvas.height - 30) npc.vy *= -1;
      });

      // Movimiento de Autos
      autos.forEach(auto => {
        auto.x += auto.vx;
        if (auto.x < -60) auto.x = canvas.width + 20;
        if (auto.x > canvas.width + 60) auto.x = -50;
      });
    }

    // RENDERIZADO DETALLADO
    function renderizar() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const calleY = canvas.height * 0.62;
      const calleAltura = 80;

      // 1. Edificios del mapa
      edificaciónes.forEach(b => {
        ctx.fillStyle = b.color;
        ctx.fillRect(b.x, b.y, b.w, b.h);
        ctx.strokeStyle = b.borde;
        ctx.lineWidth = 1.5;
        ctx.strokeRect(b.x, b.y, b.w, b.h);
      });

      // 2. Veredas
      ctx.fillStyle = '#2b3548';
      ctx.fillRect(0, calleY - 12, canvas.width, calleAltura + 24);

      // 3. Calzada
      ctx.fillStyle = '#1e2533';
      ctx.fillRect(0, calleY, canvas.width, calleAltura);

      // Línea divisoria amarilla discontinua
      ctx.strokeStyle = '#ffcc00';
      ctx.lineWidth = 2.5;
      ctx.setLineDash([15, 12]);
      ctx.beginPath();
      ctx.moveTo(0, calleY + calleAltura / 2);
      ctx.lineTo(canvas.width, calleY + calleAltura / 2);
      ctx.stroke();
      ctx.setLineDash([]);

      // 4. Árboles con sombreado dual
      arboles.forEach(a => {
        // Sombra suave
        ctx.beginPath();
        ctx.arc(a.x + 4, a.y + 4, a.r, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(0, 0, 0, 0.35)';
        ctx.fill();

        // Copa
        ctx.beginPath();
        ctx.arc(a.x, a.y, a.r, 0, Math.PI * 2);
        ctx.fillStyle = '#2e7d32';
        ctx.fill();
        ctx.strokeStyle = '#1b5e20';
        ctx.lineWidth = 3;
        ctx.stroke();
      });

      // 5. Vehículos
      autos.forEach(auto => {
        ctx.fillStyle = auto.color;
        ctx.fillRect(auto.x, auto.y, auto.w, auto.h);
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 1.5;
        ctx.strokeRect(auto.x, auto.y, auto.w, auto.h);
        // Parabrisas
        ctx.fillStyle = '#111';
        ctx.fillRect(auto.x + (auto.vx > 0 ? 25 : 8), auto.y + 3, 10, auto.h - 6);
      });

      // 6. NPCs
      npcs.forEach(npc => {
        ctx.beginPath();
        ctx.arc(npc.x, npc.y, 8, 0, Math.PI * 2);
        ctx.fillStyle = npc.color;
        ctx.fill();
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 1.5;
        ctx.stroke();
      });

      // 7. Jugador
      ctx.beginPath();
      ctx.arc(jugador.x, jugador.y, jugador.radio, 0, Math.PI * 2);
      ctx.fillStyle = jugador.color;
      ctx.fill();
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 2;
      ctx.stroke();

      renderizarMinimapa();
    }

    // MINIMAPA DETALLADO CON RETÍCULA URBANA
    function renderizarMinimapa() {
      const mw = minimapCanvas.width;
      const mh = minimapCanvas.height;

      minimapCtx.fillStyle = '#0a0f1a';
      minimapCtx.fillRect(0, 0, mw, mh);

      const ex = mw / canvas.width;
      const ey = mh / canvas.height;

      // Cuadrícula / Bloques del mapa
      minimapCtx.strokeStyle = '#1e2d42';
      minimapCtx.lineWidth = 1;
      minimapCtx.strokeRect(10, 10, mw - 20, mh - 20);

      // Calles en minimapa
      minimapCtx.fillStyle = '#223344';
      minimapCtx.fillRect(0, (canvas.height * 0.62) * ey, mw, 80 * ey);

      // Edificios en minimapa
      edificaciónes.forEach(b => {
        minimapCtx.fillStyle = '#152238';
        minimapCtx.fillRect(b.x * ex, b.y * ey, b.w * ex, b.h * ey);
      });

      // NPCs (Rojos / Azules)
      npcs.forEach(npc => {
        minimapCtx.fillStyle = npc.tipo === 'pandillero' ? '#ff3333' : '#00ccff';
        minimapCtx.fillRect(npc.x * ex - 1, npc.y * ey - 1, 3, 3);
      });

      // Jugador (Rosa Neón)
      minimapCtx.fillStyle = '#ff007f';
      minimapCtx.beginPath();
      minimapCtx.arc(jugador.x * ex, jugador.y * ey, 3.5, 0, Math.PI * 2);
      minimapCtx.fill();
    }

    function gameLoop() {
      actualizar();
      renderizar();
      requestAnimationFrame(gameLoop);
    }

    renderWeaponMenu();
    gameLoop();
  </script>
</body>
</html>
