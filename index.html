<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VICIO CITY V3.1.0 - Full Edition</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body { background: #080810; color: #fff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow: hidden; }
    
    #game-container { position: relative; width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; }
    canvas { background: #0d0f18; display: block; }

    /* UI / HUD Overlays */
    .hud-panel {
      position: absolute; top: 15px; left: 15px;
      width: 280px; padding: 12px;
      background: rgba(10, 10, 20, 0.85);
      border: 2px solid #ff007f; border-radius: 10px;
      box-shadow: 0 0 15px rgba(255, 0, 127, 0.4);
      font-size: 13px; font-weight: bold;
    }
    .hud-title { color: #ff007f; font-size: 16px; margin-bottom: 6px; text-shadow: 0 0 5px #ff007f; }
    .hud-stats { display: flex; justify-content: space-between; margin-bottom: 4px; color: #00ffff; }
    .hud-mission {
      margin-top: 8px; padding: 8px;
      background: rgba(255, 230, 0, 0.1); border: 1px solid #ffe600;
      border-radius: 6px; color: #ffe600;
    }

    /* Top Action Buttons */
    .top-buttons { position: absolute; top: 15px; right: 180px; display: flex; gap: 10px; }
    .btn-top {
      padding: 8px 16px; background: rgba(0, 255, 255, 0.15);
      border: 1.5px solid #00ffff; border-radius: 6px; color: #00ffff;
      font-weight: bold; cursor: pointer; text-shadow: 0 0 5px #00ffff;
    }
    .btn-top:hover { background: #00ffff; color: #000; }

    /* Minimap Widget */
    #minimap-container {
      position: absolute; top: 15px; right: 15px;
      width: 140px; height: 140px;
      border: 3px solid #ff007f; border-radius: 50%;
      overflow: hidden; box-shadow: 0 0 12px rgba(255, 0, 127, 0.5);
    }
    #minimap-canvas { width: 100%; height: 100%; background: #05050a; }

    /* Controls (Touch D-Pad & Action Buttons) */
    .controls-left { position: absolute; bottom: 20px; left: 20px; display: grid; grid-template-columns: repeat(3, 45px); grid-gap: 5px; }
    .dbtn { width: 45px; height: 45px; background: rgba(0, 255, 255, 0.1); border: 1.5px solid #00ffff; border-radius: 8px; color: #00ffff; font-size: 18px; display: flex; justify-content: center; align-items: center; cursor: pointer; }
    
    .controls-right { position: absolute; bottom: 20px; right: 20px; display: flex; gap: 12px; }
    .abtn { width: 55px; height: 55px; border-radius: 50%; border: 2px solid; display: flex; justify-content: center; align-items: center; font-size: 20px; cursor: pointer; }
    .btn-car { border-color: #00ffff; color: #00ffff; background: rgba(0, 255, 255, 0.1); }
    .btn-action { border-color: #ff007f; color: #ff007f; background: rgba(255, 0, 127, 0.1); }
    .btn-weapon { border-color: #ffe600; color: #ffe600; background: rgba(255, 230, 0, 0.1); }

    /* Custom Outfit Modal */
    #outfit-modal {
      display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      background: rgba(10, 10, 25, 0.95); border: 2px solid #00ffff; padding: 20px; border-radius: 12px;
      text-align: center; box-shadow: 0 0 20px #00ffff; z-index: 100;
    }
    .color-opt { width: 40px; height: 40px; border-radius: 50%; display: inline-block; margin: 8px; cursor: pointer; border: 2px solid #fff; }
  </style>
</head>
<body>

<div id="game-container">
  <canvas id="gameCanvas" width="960" height="540"></canvas>

  <!-- HUD -->
  <div class="hud-panel">
    <div class="hud-title">VICIO CITY V3.1.0</div>
    <div class="hud-stats">
      <span>LVL: <span id="val-lvl">1</span></span>
      <span>XP: <span id="val-xp">95</span>/100</span>
    </div>
    <div class="hud-stats">
      <span>HP: <span id="val-hp">100</span>/100</span>
      <span>CASH: $<span id="val-cash">960</span></span>
    </div>
    <div class="hud-stats">
      <span>WANTED: <span id="val-wanted">★☆☆☆☆</span></span>
    </div>
    <div class="hud-mission">
      🎯 <b>MISIÓN ACTIVA:</b><br>
      Elimina 3 Pandilleros en la ciudad (<span id="val-targets">0</span>/3)<br>
      <small>[Presiona 'E' o botón de acción para entrar/interactuar]</small>
    </div>
  </div>

  <!-- Botones Superiores -->
  <div class="top-buttons">
    <button class="btn-top" onclick="toggleFullscreen()">FULL</button>
    <button class="btn-top" onclick="alert('Misiones activas marcadas en el minimapa.')">MISIONES</button>
    <button class="btn-top" onclick="saveGame()">GUARDAR</button>
  </div>

  <!-- Minimapa -->
  <div id="minimap-container">
    <canvas id="minimap-canvas" width="140" height="140"></canvas>
  </div>

  <!-- Controles táctiles -->
  <div class="controls-left">
    <div></div><div class="dbtn" id="btn-up">▲</div><div></div>
    <div class="dbtn" id="btn-left">◄</div><div></div><div class="dbtn" id="btn-right">►</div>
    <div></div><div class="dbtn" id="btn-down">▼</div><div></div>
  </div>

  <div class="controls-right">
    <div class="abtn btn-car" onclick="interact()">🚗</div>
    <div class="abtn btn-action" onclick="interact()">🚪</div>
    <div class="abtn btn-weapon" onclick="attack()">🔫</div>
  </div>

  <!-- Vestidor Modal -->
  <div id="outfit-modal">
    <h3 style="color:#00ffff; margin-bottom:10px;">VESTIDOR DE ROPA</h3>
    <p>Elige el color de tu atuendo:</p>
    <div class="color-opt" style="background:#ff007f;" onclick="changeOutfit('#ff007f')"></div>
    <div class="color-opt" style="background:#00ffff;" onclick="changeOutfit('#00ffff')"></div>
    <div class="color-opt" style="background:#00ff66;" onclick="changeOutfit('#00ff66')"></div>
    <div class="color-opt" style="background:#ffaa00;" onclick="changeOutfit('#ffaa00')"></div>
    <br><br>
    <button class="btn-top" onclick="closeOutfit()">Aceptar</button>
  </div>
</div>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");
const mCanvas = document.getElementById("minimap-canvas");
const mCtx = mCanvas.getContext("2d");

// Estado Global del Juego
const gameState = {
  currentZone: "EXTERIOR", // EXTERIOR | INTERIOR_CASA | BANCO_CENTRAL
  player: {
    x: 480, y: 270, size: 20, speed: 3,
    color: "#ff007f",
    hp: 100, xp: 95, lvl: 1, cash: 960, wanted: 1
  },
  targetsDefeated: 0,
  keys: {}
};

// Ubicaciones de Puntos Clave (Edificios & Misiones)
const worldLocations = {
  homeDoor: { x: 200, y: 150, w: 60, h: 40, label: "Casa Principal", targetZone: "INTERIOR_CASA" },
  bankDoor: { x: 700, y: 150, w: 80, h: 40, label: "Banco Central", targetZone: "BANCO_CENTRAL" },
  missionTargets: [
    { x: 300, y: 400, active: true },
    { x: 600, y: 450, active: true },
    { x: 800, y: 350, active: true }
  ]
};

// Muebles de la Casa Principal
const houseFurniture = [
  { name: "Cama", x: 100, y: 100, w: 80, h: 100, color: "#3a2e56", text: "🛏️ Cama" },
  { name: "Sofá", x: 300, y: 120, w: 120, h: 50, color: "#224455", text: "🛋️ Sofá" },
  { name: "Mesa TV", x: 300, y: 220, w: 100, h: 40, color: "#443322", text: "📺 TV" },
  { name: "Vestidor", x: 700, y: 100, w: 70, h: 70, color: "#552244", text: "👔 Ropa", action: "OPEN_OUTFIT" }
];

// Event Listeners Teclado
window.addEventListener("keydown", e => {
  gameState.keys[e.key.toLowerCase()] = true;
  if(e.key.toLowerCase() === 'e') interact();
});
window.addEventListener("keyup", e => gameState.keys[e.key.toLowerCase()] = false);

// Movimiento del Jugador
function updatePlayer() {
  const p = gameState.player;
  if (gameState.keys['w'] || gameState.keys['arrowup']) p.y -= p.speed;
  if (gameState.keys['s'] || gameState.keys['arrowdown']) p.y += p.speed;
  if (gameState.keys['a'] || gameState.keys['arrowleft']) p.x -= p.speed;
  if (gameState.keys['d'] || gameState.keys['arrowright']) p.x += p.speed;

  // Limites Pantalla
  p.x = Math.max(20, Math.min(canvas.width - 20, p.x));
  p.y = Math.max(20, Math.min(canvas.height - 20, p.y));
}

// Mecánica de Entrada/Salida e Interacción
function interact() {
  const p = gameState.player;

  if (gameState.currentZone === "EXTERIOR") {
    // Entrar a la Casa
    const h = worldLocations.homeDoor;
    if (Math.hypot(p.x - (h.x + h.w/2), p.y - (h.y + h.h/2)) < 50) {
      gameState.currentZone = "INTERIOR_CASA";
      p.x = 480; p.y = 450; // Reaparecer dentro cerca de la salida
      return;
    }
  } else if (gameState.currentZone === "INTERIOR_CASA") {
    // Interactuar con el vestidor
    const closet = houseFurniture.find(f => f.action === "OPEN_OUTFIT");
    if (Math.hypot(p.x - (closet.x + closet.w/2), p.y - (closet.y + closet.h/2)) < 60) {
      document.getElementById("outfit-modal").style.display = "block";
      return;
    }
    // Salida de la Casa (zona inferior)
    if (p.y > 500) {
      gameState.currentZone = "EXTERIOR";
      p.x = worldLocations.homeDoor.x + 30;
      p.y = worldLocations.homeDoor.y + 60;
    }
  }
}

function attack() {
  if (gameState.currentZone !== "EXTERIOR") return;
  const p = gameState.player;
  worldLocations.missionTargets.forEach(t => {
    if (t.active && Math.hypot(p.x - t.x, p.y - t.y) < 60) {
      t.active = false;
      gameState.targetsDefeated++;
      document.getElementById("val-targets").innerText = gameState.targetsDefeated;
      gameState.player.cash += 150;
      document.getElementById("val-cash").innerText = gameState.player.cash;
    }
  });
}

function changeOutfit(color) {
  gameState.player.color = color;
}
function closeOutfit() {
  document.getElementById("outfit-modal").style.display = "none";
}

// Renderizado del Juego Principal
function render() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  if (gameState.currentZone === "EXTERIOR") {
    // Dibujar Ciudad Exterior
    ctx.fillStyle = "#121526";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Edificio Casa Principal
    const h = worldLocations.homeDoor;
    ctx.fillStyle = "#2a1b4e";
    ctx.fillRect(h.x, h.y - 80, h.w + 40, h.h + 80);
    ctx.strokeStyle = "#ff007f";
    ctx.strokeRect(h.x, h.y - 80, h.w + 40, h.h + 80);
    ctx.fillStyle = "#ff007f";
    ctx.font = "12px sans-serif";
    ctx.fillText("CASA PRINCIPAL", h.x, h.y - 90);
    
    // Puerta
    ctx.fillStyle = "#00ffff";
    ctx.fillRect(h.x + 20, h.y, h.w - 20, h.h);

    // Banco Central
    const b = worldLocations.bankDoor;
    ctx.fillStyle = "#1b334e";
    ctx.fillRect(b.x - 20, b.y - 80, b.w + 40, b.h + 80);
    ctx.strokeStyle = "#00ffff";
    ctx.strokeRect(b.x - 20, b.y - 80, b.w + 40, b.h + 80);
    ctx.fillStyle = "#00ffff";
    ctx.fillText("BANCO CENTRAL", b.x, b.y - 90);

    // Dibujar Pandilleros (Misión)
    worldLocations.missionTargets.forEach(t => {
      if (t.active) {
        ctx.fillStyle = "#ff3333";
        ctx.beginPath();
        ctx.arc(t.x, t.y, 12, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#fff";
        ctx.fillText("🎯 Pandillero", t.x - 25, t.y - 18);
      }
    });

  } else if (gameState.currentZone === "INTERIOR_CASA") {
    // Dibujar Interior de la Casa del Personaje
    ctx.fillStyle = "#1a1829";
    ctx.fillRect(50, 50, canvas.width - 100, canvas.height - 100);
    ctx.strokeStyle = "#00ffff";
    ctx.lineWidth = 4;
    ctx.strokeRect(50, 50, canvas.width - 100, canvas.height - 100);

    // Renderizado de Muebles y Texturas
    houseFurniture.forEach(f => {
      ctx.fillStyle = f.color;
      ctx.fillRect(f.x, f.y, f.w, f.h);
      ctx.strokeStyle = "#ffffff22";
      ctx.strokeRect(f.x, f.y, f.w, f.h);
      ctx.fillStyle = "#ffffff";
      ctx.font = "13px sans-serif";
      ctx.fillText(f.text, f.x + 10, f.y + f.h / 2);
    });

    // Zona Salida
    ctx.fillStyle = "#ff007f";
    ctx.fillRect(430, 480, 100, 20);
    ctx.fillText("SALIDA (Puerta)", 435, 475);
  }

  // Dibujar Jugador
  const p = gameState.player;
  ctx.fillStyle = p.color;
  ctx.beginPath();
  ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = "#ffffff";
  ctx.lineWidth = 2;
  ctx.stroke();

  renderMinimap();
}

// Renderizado del Minimapa con Seguimiento de Misiones (Waypoints)
function renderMinimap() {
  mCtx.clearRect(0, 0, mCanvas.width, mCanvas.height);
  mCtx.fillStyle = "#080a14";
  mCtx.fillRect(0, 0, 140, 140);

  const scaleX = 140 / canvas.width;
  const scaleY = 140 / canvas.height;

  if (gameState.currentZone === "EXTERIOR") {
    // Marcador de Casa
    mCtx.fillStyle = "#00ffff";
    mCtx.fillRect(worldLocations.homeDoor.x * scaleX, worldLocations.homeDoor.y * scaleY, 8, 8);

    // Waypoints de Objetivos/Misiones (Puntos amarillos/rojos dinámicos)
    worldLocations.missionTargets.forEach(t => {
      if (t.active) {
        mCtx.fillStyle = "#ffe600";
        mCtx.beginPath();
        mCtx.arc(t.x * scaleX, t.y * scaleY, 4, 0, Math.PI * 2);
        mCtx.fill();
      }
    });
  }

  // Posición del Jugador en Minimapa
  mCtx.fillStyle = "#ff007f";
  mCtx.beginPath();
  mCtx.arc(gameState.player.x * scaleX, gameState.player.y * scaleY, 4, 0, Math.PI * 2);
  mCtx.fill();
}

function gameLoop() {
  updatePlayer();
  render();
  requestAnimationFrame(gameLoop);
}

function saveGame() {
  alert("¡Progreso Guardado Exitosamente!");
}

function toggleFullscreen() {
  if (!document.fullscreenElement) document.documentElement.requestFullscreen();
  else if (document.exitFullscreen) document.exitFullscreen();
}

// Iniciar Juego
gameLoop();
</script>
</body>
</html>
