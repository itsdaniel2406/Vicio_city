<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vicio city - Dani Edition</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; touch-action: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'Courier New', Courier, monospace; color: #fff; }
        #canvas-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; }
        
        /* Advertencia Vertical */
        #orient-warning { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #000; color: #ff00ff; z-index: 1000; justify-content: center; align-items: center; text-align: center; font-size: 20px; font-weight: bold; }
        @media (orientation: portrait) { #orient-warning { display: flex; } }

        /* HUD - Información del Juego */
        .hud { position: absolute; top: 10px; left: 10px; right: 10px; display: flex; justify-content: space-between; z-index: 10; font-size: 14px; text-shadow: 0 0 5px #00ffff; pointer-events: none; }
        .hud-value { color: #ff00ff; font-weight: bold; }
        #mission-box { position: absolute; top: 40px; left: 10px; background: rgba(0,0,0,0.7); border: 1px solid #ff00ff; padding: 8px; border-radius: 4px; z-index: 10; font-size: 12px; color: #00ffff; max-width: 250px; }

        #fs-btn { position: absolute; top: 10px; right: 10px; padding: 6px 12px; background: rgba(0, 255, 255, 0.2); color: #00ffff; border: 1px solid #00ffff; border-radius: 4px; z-index: 20; font-weight: bold; cursor: pointer; pointer-events: auto; }

        /* Controles Táctiles Overlay */
        .controls { position: absolute; bottom: 15px; width: 100%; display: flex; justify-content: space-between; padding: 0 20px; z-index: 10; pointer-events: none; }
        .dpad, .actions { pointer-events: auto; display: grid; gap: 5px; }
        .dpad { grid-template-columns: repeat(3, 55px); grid-template-rows: repeat(3, 55px); }
        .btn { background: rgba(255, 0, 255, 0.15); border: 2px solid #ff00ff; border-radius: 8px; color: #ff00ff; font-size: 22px; font-weight: bold; display: flex; align-items: center; justify-content: center; text-shadow: 0 0 8px #ff00ff; box-shadow: 0 0 10px rgba(255,0,255,0.3); }
        .btn:active { background: rgba(255, 0, 255, 0.5); }
        .btn-up { grid-column: 2; grid-row: 1; }
        .btn-left { grid-column: 1; grid-row: 2; }
        .btn-right { grid-column: 3; grid-row: 2; }
        .btn-down { grid-column: 2; grid-row: 3; }
        .actions { display: flex; gap: 15px; align-items: flex-end; }
        .btn-action { width: 65px; height: 65px; border-radius: 50%; border-color: #00ffff; color: #00ffff; text-shadow: 0 0 8px #00ffff; box-shadow: 0 0 10px rgba(0,255,255,0.3); }
    </style>
    <!-- Three.js CDN (Librería 3D) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="orient-warning">Gira tu dispositivo a HORIZONTAL 🔄</div>
    
    <div class="hud">
        <div>SALUD: <span class="hud-value" id="hud-health">100</span></div>
        <div>WANTED: <span class="hud-value" id="hud-wanted">⭐ 0</span></div>
        <div>DINERO: <span class="hud-value" id="hud-money">$0</span></div>
    </div>
    
    <div id="mission-box">
        MISION: <span id="mission-text">Ve al marcador amarillo en el mapa para iniciar.</span>
    </div>

    <button id="fs-btn">FULLSCREEN</button>
    <div id="canvas-container"></div>

    <!-- Controles Táctiles -->
    <div class="controls">
        <div class="dpad">
            <div class="btn btn-up" id="btn-up">▲</div>
            <div class="btn btn-left" id="btn-left">◀</div>
            <div class="btn btn-right" id="btn-right">▶</div>
            <div class="btn btn-down" id="btn-down">▼</div>
        </div>
        <div class="actions">
            <div class="btn btn-action" id="btn-a">A</div> <!-- Entrar/Salir vehículo -->
            <div class="btn btn-action" id="btn-b" style="border-color: #ff00ff; color: #ff00ff;">🔫</div> <!-- Disparar -->
        </div>
    </div>

    <script>
        // --- 1. CONFIGURACIÓN TÉCNICA 3D ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x1a002a, 0.012);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setClearColor(0x1a002a);
        container.appendChild(renderer.domElement);

        // Iluminación Synthwave
        const ambientLight = new THREE.AmbientLight(0xff00ff, 0.6);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0x00ffff, 0.9);
        dirLight.position.set(30, 50, 30);
        scene.add(dirLight);

        // --- 2. MAPA, EDIFICIOS Y PALMERAS ---
        const mapSize = 300;
        const gridHelper = new THREE.GridHelper(mapSize, 60, 0xff00ff, 0x330033);
        scene.add(gridHelper);

        const colliders = [];

        // Generar Edificios 3D con luces
        const buildingGeo = new THREE.BoxGeometry(1, 1, 1);
        for (let i = 0; i < 70; i++) {
            const color = Math.random() > 0.5 ? 0x00ffff : 0xff00ff;
            const mat = new THREE.MeshLambertMaterial({ color: color, wireframe: true });
            const building = new THREE.Mesh(buildingGeo, mat);
            
            const h = 12 + Math.random() * 25;
            const w = 8 + Math.random() * 8;
            const d = 8 + Math.random() * 8;
            building.scale.set(w, h, d);
            
            let x = (Math.random() - 0.5) * (mapSize - 40);
            let z = (Math.random() - 0.5) * (mapSize - 40);
            if (Math.abs(x) < 15) x += 25; // Dejar la avenida principal libre
            
            building.position.set(x, h / 2, z);
            scene.add(building);

            colliders.push({ x, z, radius: Math.max(w, d) / 2 });
        }

        // --- 3. JUGADOR, VEHÍCULO Y POLICÍA (MODELOS PROCEDURALES) ---
        // Jugador
        const playerGroup = new THREE.Group();
        const pMesh = new THREE.Mesh(
            new THREE.CylinderGeometry(0.5, 0.5, 2, 8),
            new THREE.MeshBasicMaterial({ color: 0x00ffff })
        );
        pMesh.position.y = 1;
        playerGroup.add(pMesh);
        scene.add(playerGroup);
        playerGroup.position.set(0, 0, 20);

        let gameState = {
            health: 100,
            money: 0,
            wanted: 0,
            inVehicle: false,
            missionStep: 0
        };

        // Auto Jugador
        function createCarMesh(color) {
            const group = new THREE.Group();
            const body = new THREE.Mesh(new THREE.BoxGeometry(2.2, 1, 4.5), new THREE.MeshLambertMaterial({ color }));
            body.position.y = 0.6;
            group.add(body);
            return group;
        }

        const carGroup = createCarMesh(0xff00ff);
        scene.add(carGroup);
        carGroup.position.set(5, 0, 0);

        // Patrulla Policial
        const policeGroup = createCarMesh(0x0000ff);
        // Luz policial en el techo
        const siren = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.3, 0.3), new THREE.MeshBasicMaterial({ color: 0xff0000 }));
        siren.position.set(0, 1.2, 0);
        policeGroup.add(siren);
        scene.add(policeGroup);
        policeGroup.position.set(-50, 0, -50);

        // NPCs Ciudadanos
        const npcs = [];
        for (let i = 0; i < 15; i++) {
            const npc = new THREE.Mesh(
                new THREE.CylinderGeometry(0.4, 0.4, 1.8, 8),
                new THREE.MeshLambertMaterial({ color: 0xffff00 })
            );
            npc.position.set((Math.random() - 0.5) * 150, 0.9, (Math.random() - 0.5) * 150);
            scene.add(npc);
            npcs.push({ mesh: npc, dir: Math.random() * Math.PI * 2, speed: 0.05, alive: true });
        }

        // Marcador de Misión (Luz/Cilindro flotante)
        const missionMarker = new THREE.Mesh(
            new THREE.CylinderGeometry(2, 2, 0.2, 16),
            new THREE.MeshBasicMaterial({ color: 0xffff00, wireframe: true })
        );
        missionMarker.position.set(20, 0.1, 20);
        scene.add(missionMarker);

        // Loot Items (Dinero/Armas)
        const lootItems = [];

        // --- 4. CONTROLES TÁCTILES Y TECLADO ---
        const keys = { up: false, down: false, left: false, right: false };

        function bindTouch(id, key) {
            const el = document.getElementById(id);
            el.addEventListener('touchstart', (e) => { e.preventDefault(); keys[key] = true; });
            el.addEventListener('touchend', (e) => { e.preventDefault(); keys[key] = false; });
        }
        bindTouch('btn-up', 'up'); bindTouch('btn-down', 'down');
        bindTouch('btn-left', 'left'); bindTouch('btn-right', 'right');

        // Botón A: Subir/Bajar Auto
        document.getElementById('btn-a').addEventListener('touchstart', (e) => { e.preventDefault(); toggleVehicle(); });
        // Botón B: Disparar
        document.getElementById('btn-b').addEventListener('touchstart', (e) => { e.preventDefault(); shootWeapon(); });

        window.addEventListener('keydown', (e) => {
            if (e.key === 'w' || e.key === 'ArrowUp') keys.up = true;
            if (e.key === 's' || e.key === 'ArrowDown') keys.down = true;
            if (e.key === 'a' || e.key === 'ArrowLeft') keys.left = true;
            if (e.key === 'd' || e.key === 'ArrowRight') keys.right = true;
            if (e.key === ' ') toggleVehicle();
            if (e.key === 'f') shootWeapon();
        });
        window.addEventListener('keyup', (e) => {
            if (e.key === 'w' || e.key === 'ArrowUp') keys.up = false;
            if (e.key === 's' || e.key === 'ArrowDown') keys.down = false;
            if (e.key === 'a' || e.key === 'ArrowLeft') keys.left = false;
            if (e.key === 'd' || e.key === 'ArrowRight') keys.right = false;
        });

        function toggleVehicle() {
            const dist = playerGroup.position.distanceTo(carGroup.position);
            if (gameState.inVehicle) {
                gameState.inVehicle = false;
                playerGroup.position.copy(carGroup.position).add(new THREE.Vector3(2, 0, 0));
                playerGroup.visible = true;
            } else if (dist < 5) {
                gameState.inVehicle = true;
                playerGroup.visible = false;
            }
        }

        // --- 5. MECÁNICAS DE DISPARO, POLICÍA Y MISIONES ---
        function shootWeapon() {
            if (gameState.inVehicle) return;

            // Al disparar sube el nivel de búsqueda
            gameState.wanted = Math.min(gameState.wanted + 1, 5);
            updateHUD();

            // Bala (Línea de rayo)
            const activeObj = playerGroup;
            const dir = new THREE.Vector3(0, 0, -1).applyAxisAngle(new THREE.Vector3(0, 1, 0), activeObj.rotation.y);
            
            // Impacto a NPCs
            npcs.forEach(npc => {
                if (npc.alive) {
                    const dist = npc.mesh.position.distanceTo(activeObj.position);
                    if (dist < 20) {
                        npc.alive = false;
                        npc.mesh.rotation.x = Math.PI / 2; // Cae al suelo
                        
                        // Generar Dinero Loot
                        const loot = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.2, 0.5), new THREE.MeshBasicMaterial({ color: 0x00ff00 }));
                        loot.position.copy(npc.mesh.position);
                        scene.add(loot);
                        lootItems.push(loot);
                    }
                }
            });
        }

        function spawnLootCheck() {
            lootItems.forEach((loot, index) => {
                const target = gameState.inVehicle ? carGroup : playerGroup;
                if (target.position.distanceTo(loot.position) < 2.5) {
                    scene.remove(loot);
                    lootItems.splice(index, 1);
                    gameState.money += 100;
                    updateHUD();
                }
            });
        }

        function updateHUD() {
            document.getElementById('hud-health').innerText = gameState.health;
            document.getElementById('hud-wanted').innerText = "⭐ " + gameState.wanted;
            document.getElementById('hud-money').innerText = "$" + gameState.money;
        }

        function checkMission() {
            const target = gameState.inVehicle ? carGroup : playerGroup;
            if (target.position.distanceTo(missionMarker.position) < 4) {
                if (gameState.missionStep === 0) {
                    gameState.missionStep = 1;
                    gameState.money += 500;
                    missionMarker.position.set(-40, 0.1, -30);
                    document.getElementById('mission-text').innerText = "¡Misión 1 Completada (+$500)! Ahora ve al punto norte.";
                    updateHUD();
                } else if (gameState.missionStep === 1) {
                    gameState.missionStep = 2;
                    gameState.money += 1000;
                    missionMarker.visible = false;
                    document.getElementById('mission-text').innerText = "¡MISIONES COMPLETADAS! Explora la ciudad libremente.";
                    updateHUD();
                }
            }
        }

        // Fullscreen
        document.getElementById('fs-btn').addEventListener('click', () => {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
                if (screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape');
            } else { document.exitFullscreen(); }
        });

        // --- 6. BUCLE DE ANIMACIÓN E IA ---
        let carSpeed = 0;

        function animate() {
            requestAnimationFrame(animate);

            const activeObj = gameState.inVehicle ? carGroup : playerGroup;
            const turnSpeed = gameState.inVehicle ? 0.04 : 0.06;
            const maxSpeed = gameState.inVehicle ? 0.7 : 0.2;

            // Movimiento
            if (keys.left) activeObj.rotation.y += turnSpeed;
            if (keys.right) activeObj.rotation.y -= turnSpeed;

            if (keys.up) carSpeed = Math.min(carSpeed + 0.02, maxSpeed);
            else if (keys.down) carSpeed = Math.max(carSpeed - 0.02, -maxSpeed / 2);
            else carSpeed *= 0.92; // Fricción

            activeObj.translateZ(-carSpeed);

            if (gameState.inVehicle) playerGroup.position.copy(carGroup.position);

            // IA NPCs (Caminar aleatorio)
            npcs.forEach(npc => {
                if (npc.alive) {
                    npc.mesh.translateZ(-npc.speed);
                    if (Math.random() < 0.02) npc.mesh.rotation.y += (Math.random() - 0.5);
                }
            });

            // IA Policía (Si tienes Wanted Level > 0, la patrulla te persigue)
            if (gameState.wanted > 0) {
                policeGroup.lookAt(activeObj.position);
                policeGroup.translateZ(0.25);

                // Si te alcanza la policía
                if (policeGroup.position.distanceTo(activeObj.position) < 3) {
                    gameState.health = Math.max(0, gameState.health - 1);
                    updateHUD();
                }
            }

            spawnLootCheck();
            checkMission();

            // Cámara 3ª Persona
            const camOffset = new THREE.Vector3(0, 5, 10).applyMatrix4(activeObj.matrixWorld);
            camera.position.lerp(camOffset, 0.1);
            camera.lookAt(activeObj.position.clone().add(new THREE.Vector3(0, 1, 0)));

            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
