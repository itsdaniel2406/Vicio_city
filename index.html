<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Vice City 3D - Full Engine</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }
        body, html {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #05000a;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
        }
        /* Canvas cubre el 100% real de la pantalla */
        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* Bloqueo Horizontal */
        #orient-warning {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000;
            color: #ff00ff;
            z-index: 1000;
            justify-content: center;
            align-items: center;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            text-shadow: 0 0 10px #ff00ff;
        }
        @media (orientation: portrait) { #orient-warning { display: flex; } }

        /* HUD - Barra Superior Limpia */
        .hud-bar {
            position: absolute;
            top: env(safe-area-inset-top, 10px);
            left: 15px;
            right: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
            pointer-events: none;
        }
        .hud-card {
            background: rgba(10, 0, 20, 0.75);
            border: 1.5px solid #ff00ff;
            box-shadow: 0 0 10px rgba(255, 0, 255, 0.4);
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: bold;
            letter-spacing: 1px;
            text-shadow: 0 0 5px #00ffff;
        }
        .hud-value { color: #00ffff; font-size: 15px; }

        /* Misión Box */
        #mission-box {
            position: absolute;
            top: 55px;
            left: 15px;
            background: rgba(0, 0, 0, 0.8);
            border-left: 4px solid #00ffff;
            padding: 8px 12px;
            border-radius: 4px;
            z-index: 10;
            font-size: 12px;
            color: #fff;
            max-width: 280px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            pointer-events: none;
        }

        /* Botón Fullscreen */
        #fs-btn {
            pointer-events: auto;
            background: rgba(0, 255, 255, 0.2);
            color: #00ffff;
            border: 1px solid #00ffff;
            padding: 6px 12px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 11px;
            cursor: pointer;
            box-shadow: 0 0 8px rgba(0,255,255,0.4);
        }

        /* Controles Táctiles Integrados y con Margen Adaptativo */
        .controls {
            position: absolute;
            bottom: env(safe-area-inset-bottom, 20px);
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 25px;
            z-index: 10;
            pointer-events: none;
        }
        .dpad, .actions { pointer-events: auto; display: grid; gap: 6px; }
        .dpad { grid-template-columns: repeat(3, 50px); grid-template-rows: repeat(3, 50px); }
        .btn {
            background: rgba(255, 0, 255, 0.2);
            border: 2px solid #ff00ff;
            border-radius: 12px;
            color: #fff;
            font-size: 20px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            text-shadow: 0 0 6px #ff00ff;
            box-shadow: 0 0 12px rgba(255,0,255,0.3);
        }
        .btn:active { background: rgba(255, 0, 255, 0.6); transform: scale(0.95); }
        .btn-up { grid-column: 2; grid-row: 1; }
        .btn-left { grid-column: 1; grid-row: 2; }
        .btn-right { grid-column: 3; grid-row: 2; }
        .btn-down { grid-column: 2; grid-row: 3; }
        
        .actions { display: flex; gap: 15px; align-items: flex-end; }
        .btn-action {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border-color: #00ffff;
            color: #00ffff;
            font-size: 22px;
            box-shadow: 0 0 12px rgba(0,255,255,0.4);
        }
        .btn-action:active { background: rgba(0, 255, 255, 0.5); }
    </style>
    <!-- Three.js + GLTFLoader Addon -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>

    <div id="orient-warning">Gira tu dispositivo a HORIZONTAL 🔄</div>
    
    <div class="hud-bar">
        <div class="hud-card">SALUD: <span class="hud-value" id="hud-health">100</span></div>
        <div class="hud-card">WANTED: <span class="hud-value" id="hud-wanted">⭐ 0</span></div>
        <div class="hud-card">DINERO: <span class="hud-value" id="hud-money">$0</span></div>
        <button id="fs-btn">PANTALLA COMPLETA</button>
    </div>
    
    <div id="mission-box">
        <b>MISIÓN:</b> <span id="mission-text">Súbete al deportivo rosa o ve al marcador amarillo.</span>
    </div>

    <div id="canvas-container"></div>

    <div class="controls">
        <div class="dpad">
            <div class="btn btn-up" id="btn-up">▲</div>
            <div class="btn btn-left" id="btn-left">◀</div>
            <div class="btn btn-right" id="btn-right">▶</div>
            <div class="btn btn-down" id="btn-down">▼</div>
        </div>
        <div class="actions">
            <div class="btn btn-action" id="btn-a">🚗</div>
            <div class="btn btn-action" id="btn-b" style="border-color: #ff007f; color: #ff007f;">🔫</div>
        </div>
    </div>

    <script>
        // --- 1. SETUP DE ESCENA Y RENDERIZADOR ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x0a001a, 0.012);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        
        // Ajuste exacto al Viewport
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        // --- 2. ILUMINACIÓN Y AMBIENTE ---
        const ambientLight = new THREE.AmbientLight(0xd8b4fe, 0.7);
        scene.add(ambientLight);

        const mainLight = new THREE.DirectionalLight(0x00ffff, 1.2);
        mainLight.position.set(40, 60, 20);
        mainLight.castShadow = true;
        mainLight.shadow.mapSize.width = 1024;
        mainLight.shadow.mapSize.height = 1024;
        scene.add(mainLight);

        const pinkLight = new THREE.PointLight(0xff007f, 2, 80);
        pinkLight.position.set(0, 10, 0);
        scene.add(pinkLight);

        // --- 3. CONSTRUCCIÓN DE LA CIUDAD (Piso, Edificios con Textura/Material) ---
        // Suelo Asfalto
        const roadGeo = new THREE.PlaneGeometry(300, 300);
        const roadMat = new THREE.MeshStandardMaterial({ color: 0x111115, roughness: 0.8 });
        const road = new THREE.Mesh(roadGeo, roadMat);
        road.rotation.x = -Math.PI / 2;
        road.receiveShadow = true;
        scene.add(road);

        // Grid Neón
        const gridHelper = new THREE.GridHelper(300, 60, 0xff00ff, 0x220033);
        gridHelper.position.y = 0.01;
        scene.add(gridHelper);

        // Creador Procedural de Edificios Bonitos (Fallback si no hay GLB)
        function createDetailedBuilding(w, h, d, color) {
            const group = new THREE.Group();
            const mat = new THREE.MeshStandardMaterial({ color: 0x181825, roughness: 0.3 });
            const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
            mesh.position.y = h / 2;
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            group.add(mesh);

            // Marcos Neón
            const edges = new THREE.EdgesGeometry(new THREE.BoxGeometry(w, h, d));
            const lineMat = new THREE.LineBasicMaterial({ color: color });
            const wireframe = new THREE.LineSegments(edges, lineMat);
            wireframe.position.y = h / 2;
            group.add(wireframe);

            return group;
        }

        const mapSize = 260;
        for (let i = 0; i < 45; i++) {
            const color = Math.random() > 0.5 ? 0x00ffff : 0xff00ff;
            const h = 15 + Math.random() * 30;
            const w = 10 + Math.random() * 8;
            const d = 10 + Math.random() * 8;

            const bld = createDetailedBuilding(w, h, d, color);
            let x = (Math.random() - 0.5) * mapSize;
            let z = (Math.random() - 0.5) * mapSize;
            if (Math.abs(x) < 20) x += 35; // Avenida Libre

            bld.position.set(x, 0, z);
            scene.add(bld);
        }

        // --- 4. MODELOS DE PERSONAJES Y VEHÍCULOS (CON GLTFLoader Y FALLBACKS) ---
        const loader = new THREE.GLTFLoader();

        // Creamos Jugador Avanzado
        function buildHumanoid() {
            const group = new THREE.Group();
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0x00ffff, roughness: 0.2, metalness: 0.5 });
            
            // Torso
            const torso = new THREE.Mesh(new THREE.BoxGeometry(0.8, 1.2, 0.5), bodyMat);
            torso.position.y = 1.2;
            torso.castShadow = true;
            group.add(torso);

            // Cabeza
            const head = new THREE.Mesh(new THREE.SphereGeometry(0.3, 16, 16), new THREE.MeshStandardMaterial({ color: 0xffcc99 }));
            head.position.y = 2.0;
            head.castShadow = true;
            group.add(head);

            return group;
        }

        const playerGroup = buildHumanoid();
        playerGroup.position.set(0, 0, 15);
        scene.add(playerGroup);

        // Creamos Auto Avanzado
        function buildCar(colorHex) {
            const group = new THREE.Group();
            const carMat = new THREE.MeshStandardMaterial({ color: colorHex, metalness: 0.8, roughness: 0.2 });
            
            const body = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.8, 4.2), carMat);
            body.position.y = 0.6;
            body.castShadow = true;
            group.add(body);

            const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.6, 2.0), new THREE.MeshStandardMaterial({ color: 0x111, roughness: 0.1 }));
            cabin.position.set(0, 1.1, -0.2);
            group.add(cabin);

            // Ruedas
            const wheelMat = new THREE.MeshStandardMaterial({ color: 0x050505 });
            const wheelGeo = new THREE.CylinderGeometry(0.4, 0.4, 0.3, 16);
            [ [-1.2, 0.4, 1.2], [1.2, 0.4, 1.2], [-1.2, 0.4, -1.2], [1.2, 0.4, -1.2] ].forEach(pos => {
                const w = new THREE.Mesh(wheelGeo, wheelMat);
                w.rotation.z = Math.PI / 2;
                w.position.set(...pos);
                group.add(w);
            });

            return group;
        }

        const carGroup = buildCar(0xff007f);
        carGroup.position.set(6, 0, 0);
        scene.add(carGroup);

        const policeGroup = buildCar(0x0022ff);
        const siren = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.2, 0.2), new THREE.MeshBasicMaterial({ color: 0xff0000 }));
        siren.position.set(0, 1.5, 0);
        policeGroup.add(siren);
        policeGroup.position.set(-60, 0, -60);
        scene.add(policeGroup);

        // Intentar cargar modelo GLB Anónimo/Externo (Demostración de Integración)
        loader.load(
            'https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/master/2.0/Duck/glTF-Binary/Duck.glb',
            (gltf) => {
                const duck = gltf.scene;
                duck.scale.set(0.8, 0.8, 0.8);
                duck.position.set(0, 0, -10);
                scene.add(duck);
            },
            undefined,
            (err) => console.log("GLB Opcional no cargado, usando modelo procedural fallback.")
        );

        // NPCs
        const npcs = [];
        for(let i = 0; i < 12; i++) {
            const npcMesh = buildHumanoid();
            npcMesh.position.set((Math.random() - 0.5) * 140, 0, (Math.random() - 0.5) * 140);
            scene.add(npcMesh);
            npcs.push({ mesh: npcMesh, alive: true, dir: Math.random() * Math.PI * 2 });
        }

        // Marcador Misión
        const missionMarker = new THREE.Mesh(
            new THREE.CylinderGeometry(2, 2, 0.1, 16),
            new THREE.MeshBasicMaterial({ color: 0xffff00, wireframe: true })
        );
        missionMarker.position.set(25, 0.1, 25);
        scene.add(missionMarker);

        // --- 5. LÓGICA DE ESTADO Y CONTROLES ---
        let gameState = { health: 100, money: 0, wanted: 0, inVehicle: false, missionStep: 0 };
        const keys = { up: false, down: false, left: false, right: false };

        function bindTouch(id, key) {
            const el = document.getElementById(id);
            el.addEventListener('touchstart', (e) => { e.preventDefault(); keys[key] = true; });
            el.addEventListener('touchend', (e) => { e.preventDefault(); keys[key] = false; });
        }
        bindTouch('btn-up', 'up'); bindTouch('btn-down', 'down');
        bindTouch('btn-left', 'left'); bindTouch('btn-right', 'right');

        document.getElementById('btn-a').addEventListener('touchstart', (e) => { e.preventDefault(); toggleVehicle(); });
        document.getElementById('btn-b').addEventListener('touchstart', (e) => { e.preventDefault(); shootWeapon(); });

        window.addEventListener('keydown', (e) => {
            if (e.key === 'w' || e.key === 'ArrowUp') keys.up = true;
            if (e.key === 's' || e.key === 'ArrowDown') keys.down = true;
            if (e.key === 'a' || e.key === 'ArrowLeft') keys.left = true;
            if (e.key === 'd' || e.key === 'ArrowRight') keys.right = true;
            if (e.key === ' ') toggleVehicle();
            if (e.key === 'f') shootWeapon();
        });
        window.addEventListener('keyup', (e) => {
            if (e.key === 'w' || e.key === 'ArrowUp') keys.up = false;
            if (e.key === 's' || e.key === 'ArrowDown') keys.down = false;
            if (e.key === 'a' || e.key === 'ArrowLeft') keys.left = false;
            if (e.key === 'd' || e.key === 'ArrowRight') keys.right = false;
        });

        function toggleVehicle() {
            const dist = playerGroup.position.distanceTo(carGroup.position);
            if (gameState.inVehicle) {
                gameState.inVehicle = false;
                playerGroup.position.copy(carGroup.position).add(new THREE.Vector3(2, 0, 0));
                playerGroup.visible = true;
            } else if (dist < 4.5) {
                gameState.inVehicle = true;
                playerGroup.visible = false;
            }
        }

        function shootWeapon() {
            if (gameState.inVehicle) return;
            gameState.wanted = Math.min(gameState.wanted + 1, 5);
            updateHUD();

            const activeObj = playerGroup;
            npcs.forEach(npc => {
                if (npc.alive && npc.mesh.position.distanceTo(activeObj.position) < 18) {
                    npc.alive = false;
                    npc.mesh.rotation.x = Math.PI / 2;
                    gameState.money += 150;
                    updateHUD();
                }
            });
        }

        function updateHUD() {
            document.getElementById('hud-health').innerText = gameState.health;
            document.getElementById('hud-wanted').innerText = "⭐ " + gameState.wanted;
            document.getElementById('hud-money').innerText = "$" + gameState.money;
        }

        // Resize automático sin distorsión
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Fullscreen
        document.getElementById('fs-btn').addEventListener('click', () => {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
                if (screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape');
            } else { document.exitFullscreen(); }
        });

        // --- 6. ANIMACIÓN Y BUCLE PRINCIPAL ---
        let carSpeed = 0;

        function animate() {
            requestAnimationFrame(animate);

            const activeObj = gameState.inVehicle ? carGroup : playerGroup;
            const turnSpeed = gameState.inVehicle ? 0.04 : 0.05;
            const maxSpeed = gameState.inVehicle ? 0.8 : 0.22;

            if (keys.left) activeObj.rotation.y += turnSpeed;
            if (keys.right) activeObj.rotation.y -= turnSpeed;

            if (keys.up) carSpeed = Math.min(carSpeed + 0.02, maxSpeed);
            else if (keys.down) carSpeed = Math.max(carSpeed - 0.02, -maxSpeed / 2);
            else carSpeed *= 0.92;

            activeObj.translateZ(-carSpeed);

            if (gameState.inVehicle) playerGroup.position.copy(carGroup.position);

            // Policía persigue si hay estrellas
            if (gameState.wanted > 0) {
                policeGroup.lookAt(activeObj.position);
                policeGroup.translateZ(0.3);
                if (policeGroup.position.distanceTo(activeObj.position) < 3) {
                    gameState.health = Math.max(0, gameState.health - 1);
                    updateHUD();
                }
            }

            // Cámara en 3ª Persona Suave
            const camOffset = new THREE.Vector3(0, 5, 11).applyMatrix4(activeObj.matrixWorld);
            camera.position.lerp(camOffset, 0.1);
            camera.lookAt(activeObj.position.clone().add(new THREE.Vector3(0, 1.2, 0)));

            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
