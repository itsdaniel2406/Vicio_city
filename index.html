<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>VICIO CITY V3.4.0 - Ultra Detail, Weapons & Physics Fix</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }
    body {
      background: #000;
      color: #fff;
      font-family: 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }
    #game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
    }
    canvas { display: block; background: #05070f; }

    /* HUD Principal */
    .hud-panel {
      position: absolute;
      top: 10px;
      left: 10px;
      width: 270px;
      padding: 10px;
      background: rgba(10, 12, 24, 0.9);
      border: 2px solid #ff007f;
      border-radius: 8px;
      box-shadow: 0 0 15px rgba(255, 0, 127, 0.4);
      font-size: 11px;
      font-weight: bold;
      z-index: 10;
      pointer-events: none;
    }
    .hud-title { color: #ff007f; font-size: 14px; margin-bottom: 4px; display: flex; justify-content: space-between; }
    .hud-stats { display: flex; justify-content: space-between; margin-bottom: 3px; color: #00ffff; }
    .hud-mission {
      margin-top: 6px;
      padding: 6px;
      background: rgba(255, 230, 0, 0.12);
      border: 1px solid #ffe600;
      border-radius: 5px;
      color: #ffe600;
    }

    /* Botones Superiores */
    .top-buttons {
      position: absolute;
      top: 10px;
      right: 140px;
      display: flex;
      gap: 6px;
      z-index: 10;
    }
    .btn-top {
      padding: 6px 12px;
      background: rgba(0, 255, 255, 0.2);
      border: 1.5px solid #00ffff;
      border-radius: 5px;
      color: #00ffff;
      font-weight: bold;
      font-size: 11px;
      cursor: pointer;
    }

    /* Minimapa Circular */
    #minimap-container {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 110px;
      height: 110px;
      border: 2px solid #ff007f;
      border-radius: 50%;
      overflow: hidden;
      box-shadow: 0 0 12px rgba(255, 0, 127, 0.5);
      z-index: 10;
      pointer-events: none;
    }
    #minimap-canvas { width: 100%; height: 100%; background: #030408; }

    /* D-PAD Táctil */
    .controls-left {
      position: absolute;
      bottom: 15px;
      left: 15px;
      display: grid;
      grid-template-columns: repeat(3, 46px);
      grid-gap: 4px;
      z-index: 20;
    }
    .dbtn {
      width: 46px;
      height: 46px;
      background: rgba(0, 255, 255, 0.25);
      border: 1.5px solid #00ffff;
      border-radius: 8px;
      color: #00ffff;
      font-size: 18px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Botones de Acción Derecha */
    .controls-right {
      position: absolute;
      bottom: 15px;
      right: 15px;
      display: flex;
      align-items: center;
      gap: 8px;
      z-index: 20;
    }
    .abtn {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      border: 2px solid;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 0 10px rgba(0,0,0,0.5);
    }
    .btn-car { border-color: #00ffff; color: #00ffff; background: rgba(0, 255, 255, 0.25); }
    .btn-action { border-color: #ff007f; color: #ff007f; background: rgba(255, 0, 127, 0.25); }
    .btn-switch { border-color: #00ff66; color: #00ff66; background: rgba(0, 255, 102, 0.25); font-size: 13px; }
    .btn-shoot { border-color: #ffe600; color: #ffe600; background: rgba(255, 230, 0, 0.35); width: 60px; height: 60px; font-size: 24px; }

    /* Modal Vestidor */
    #outfit-modal {
      display: none;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(10, 12, 26, 0.96);
      border: 2px solid #00ffff;
      padding: 20px;
      border-radius: 12px;
      text-align: center;
      z-index: 100;
      box-shadow: 0 0 20px rgba(0,255,255,0.4);
    }
    .color-opt {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: inline-block;
      margin: 8px;
      cursor: pointer;
      border: 2px solid #fff;
    }
  </style>
</head>
<body>

<div id="game-container">
  <canvas id="gameCanvas"></canvas>

  <div class="hud-panel">
    <div class="hud-title"><span>VICIO CITY V3.4.0</span> <span id="val-zone" style="color:#00ff66;">EXTERIOR</span></div>
    <div class="hud-stats"><span>LVL: 1</span><span>XP: 95/100</span></div>
    <div class="hud-stats"><span>HP: <span id="val-hp">100</span>/100</span><span>CASH: $<span id="val-cash">960</span></span></div>
    <div class="hud-stats"><span>VEHÍCULO: <span id="val-veh" style="color:#ffe600;">A Pie</span></span></div>
    <div class="hud-stats"><span>ARMA: <span id="val-weapon" style="color:#00ff66;">Pistola 9mm</span></span></div>
    <div class="hud-mission">
      🎯 <b>MISIÓN ACTIVA:</b><br>
      Elimina 3 Pandilleros (<span id="val-targets">0</span>/3)<br>
      <small>[Explora edificios, cámbiate de ropa y prueba las armas]</small>
    </div>
  </div>

  <div class="top-buttons">
    <button class="btn-top" onclick="toggleFullscreen()">FULL</button>
    <button class="btn-top" onclick="alert('Usa los botones o las teclas W A S D / Flechas para moverte. Tecla Espacio: Disparar. Tecla R: Cambiar arma. Tecla F: Entrar/Salir. Tecla E: Vehículos.')">HELP</button>
    <button class="btn-top" onclick="alert('Progreso Guardado')">GUARDAR</button>
  </div>

  <div id="minimap-container">
    <canvas id="minimap-canvas" width="110" height="110"></canvas>
  </div>

  <div class="controls-left">
    <div></div><div class="dbtn" id="btn-up">▲</div><div></div>
    <div class="dbtn" id="btn-left">◀</div><div></div><div class="dbtn" id="btn-right">▶</div>
    <div></div><div class="dbtn" id="btn-down">▼</div><div></div>
  </div>

  <div class="controls-right">
    <div class="abtn btn-switch" id="btn-switch">🔄 ARMA</div>
    <div class="abtn btn-car" id="btn-car">🚗</div>
    <div class="abtn btn-action" id="btn-door">🚪</div>
    <div class="abtn btn-shoot" id="btn-shoot">🔥</div>
  </div>

  <div id="outfit-modal">
    <h3 style="color:#00ffff; margin-bottom:10px;">VESTIDOR DE ROPA</h3>
    <p style="font-size:12px; margin-bottom:10px;">Elige el estilo de tu personaje:</p>
    <div class="color-opt" style="background:#ff007f;" onclick="changeOutfit('#ff007f')"></div>
    <div class="color-opt" style="background:#00ffff;" onclick="changeOutfit('#00ffff')"></div>
    <div class="color-opt" style="background:#00ff66;" onclick="changeOutfit('#00ff66')"></div>
    <div class="color-opt" style="background:#ffaa00;" onclick="changeOutfit('#ffaa00')"></div>
    <div class="color-opt" style="background:#a855f7;" onclick="changeOutfit('#a855f7')"></div>
    <br><br>
    <button class="btn-top" onclick="closeOutfit()">Aceptar</button>
  </div>
</div>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");
const mCanvas = document.getElementById("minimap-canvas");
const mCtx = mCanvas.getContext("2d");

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener("resize", resize);
resize();

const WORLD = { width: 2600, height: 2600 };
const camera = { x: 0, y: 0 };
let heliRotorAngle = 0;
let muzzleFlashTime = 0;

// Tipos de Armas
const WEAPONS = [
  { name: "Pistola 9mm", speed: 14, damage: 20, spread: 0, count: 1, rate: 200 },
  { name: "Escopeta Recortada", speed: 12, damage: 15, spread: 0.25, count: 4, rate: 500 },
  { name: "Rifle M4 / Neón", speed: 18, damage: 12, spread: 0.05, count: 1, rate: 90 }
];
let currentWeaponIndex = 0;
let lastShotTime = 0;

// Jugador
const player = {
  x: 1200, y: 1200, radius: 14, speed: 4.2, angle: 0,
  color: "#ff007f", cash: 960, hp: 100,
  vehicle: null, dirX: 0, dirY: -1
};

// Vehículos Detallados
const vehicles = [
  { id: 1, type: "CAR_SEDAN", name: "Sedán Urbano", x: 1280, y: 1230, w: 40, h: 68, speed: 6.5, color: "#00ffff", angle: 0 },
  { id: 2, type: "CAR_SUPER", name: "Superdeportivo Neon", x: 1600, y: 1200, w: 44, h: 74, speed: 10.5, color: "#ff007f", angle: 0, neon: true },
  { id: 3, type: "BIKE", name: "Moto Pista", x: 1100, y: 1300, w: 22, h: 48, speed: 8.8, color: "#ffe600", angle: 0 },
  { id: 4, type: "HELI", name: "Helicóptero", x: 1850, y: 800, w: 52, h: 85, speed: 7.8, color: "#00ff66", angle: 0 },
  { id: 5, type: "TANK", name: "Tanque Blindado", x: 650, y: 1650, w: 58, h: 80, speed: 3.5, color: "#455a64", angle: 0 }
];

// Edificios y Obstáculos del Exterior
const buildings = [
  { id: "CASA", label: "Casa Principal", x: 1050, y: 950, w: 160, h: 120, doorX: 1130, doorY: 1070, color: "#1e1b4b" },
  { id: "BANCO", label: "Banco Central", x: 1500, y: 950, w: 200, h: 130, doorX: 1600, doorY: 1080, color: "#0f2942" },
  { id: "TALLER", label: "Taller Tuning", x: 750, y: 1400, w: 180, h: 130, doorX: 840, doorY: 1530, color: "#311b11" }
];

// Definición de Interiores (Habitaciones + Muebles)
const INTERIORS = {
  bounds: { x: 200, y: 120, w: 800, h: 500 },
  exitDoor: { x: 600, y: 600, w: 80, h: 20 },
  furniture: [
    { type: "BED", x: 250, y: 150, w: 100, h: 130, color: "#6366f1", label: "Cama King" },
    { type: "WARDROBE", x: 400, y: 130, w: 90, h: 45, color: "#78350f", label: "Armario" },
    { type: "DESK", x: 550, y: 140, w: 110, h: 60, color: "#451a03", label: "Escritorio PC" },
    { type: "SOFA", x: 750, y: 300, w: 70, h: 140, color: "#0284c7", label: "Sillón Confort" },
    { type: "OUTFIT_BOX", x: 900, y: 150, w: 70, h: 70, color: "#ff007f", label: "👔 Vestidor" }
  ]
};

const bullets = [];
const enemies = [
  { x: 900, y: 1300, radius: 14, hp: 40, active: true, dirX: 1, dirY: 0 },
  { x: 1400, y: 800, radius: 14, hp: 40, active: true, dirX: 0, dirY: 1 },
  { x: 1700, y: 1500, radius: 14, hp: 40, active: true, dirX: -1, dirY: 0 }
];

let targetsDefeated = 0;
let currentZone = "EXTERIOR"; // EXTERIOR o ID de Edificio
const keys = { up: false, down: false, left: false, right: false };

// Eventos de Entrada
window.addEventListener("keydown", e => {
  const k = e.key.toLowerCase();
  if (k === 'w' || k === 'arrowup') keys.up = true;
  if (k === 's' || k === 'arrowdown') keys.down = true;
  if (k === 'a' || k === 'arrowleft') keys.left = true;
  if (k === 'd' || k === 'arrowright') keys.right = true;
  if (k === ' ') shoot();
  if (k === 'r') cycleWeapon();
  if (k === 'e') interactVehicle();
  if (k === 'f') interactDoor();
});

window.addEventListener("keyup", e => {
  const k = e.key.toLowerCase();
  if (k === 'w' || k === 'arrowup') keys.up = false;
  if (k === 's' || k === 'arrowdown') keys.down = false;
  if (k === 'a' || k === 'arrowleft') keys.left = false;
  if (k === 'd' || k === 'arrowright') keys.right = false;
});

function bindTouch(id, action) {
  const el = document.getElementById(id);
  if (!el) return;
  el.addEventListener("touchstart", e => {
    e.preventDefault();
    if (typeof action === "string") keys[action] = true;
    else if (typeof action === "function") action();
  }, { passive: false });
  el.addEventListener("touchend", e => {
    e.preventDefault();
    if (typeof action === "string") keys[action] = false;
  }, { passive: false });
}

bindTouch("btn-up", "up");
bindTouch("btn-down", "down");
bindTouch("btn-left", "left");
bindTouch("btn-right", "right");
bindTouch("btn-shoot", shoot);
bindTouch("btn-switch", cycleWeapon);
bindTouch("btn-car", interactVehicle);
bindTouch("btn-door", interactDoor);

function cycleWeapon() {
  currentWeaponIndex = (currentWeaponIndex + 1) % WEAPONS.length;
  document.getElementById("val-weapon").innerText = WEAPONS[currentWeaponIndex].name;
}

function shoot() {
  const now = Date.now();
  const wpn = WEAPONS[currentWeaponIndex];
  if (now - lastShotTime < wpn.rate) return;
  lastShotTime = now;
  muzzleFlashTime = 5;

  const isTank = player.vehicle && player.vehicle.type === "TANK";
  const baseAngle = Math.atan2(player.dirY, player.dirX);

  if (isTank) {
    bullets.push({
      x: player.x + Math.cos(baseAngle) * 40,
      y: player.y + Math.sin(baseAngle) * 40,
      vx: Math.cos(baseAngle) * 16,
      vy: Math.sin(baseAngle) * 16,
      isCannon: true,
      damage: 100,
      life: 60
    });
    return;
  }

  for (let i = 0; i < wpn.count; i++) {
    const finalAngle = baseAngle + (Math.random() - 0.5) * wpn.spread;
    bullets.push({
      x: player.x + Math.cos(baseAngle) * 18,
      y: player.y + Math.sin(baseAngle) * 18,
      vx: Math.cos(finalAngle) * wpn.speed,
      vy: Math.sin(finalAngle) * wpn.speed,
      isCannon: false,
      damage: wpn.damage,
      life: 45
    });
  }
}

function interactVehicle() {
  if (currentZone !== "EXTERIOR") return; // No usar autos dentro
  if (!player.vehicle) {
    let closest = null;
    let minDist = 70;
    vehicles.forEach(v => {
      const d = Math.hypot(player.x - v.x, player.y - v.y);
      if (d < minDist) { minDist = d; closest = v; }
    });
    if (closest) {
      player.vehicle = closest;
      document.getElementById("val-veh").innerText = closest.name;
    }
  } else {
    player.x = player.vehicle.x + 50;
    player.vehicle = null;
    document.getElementById("val-veh").innerText = "A Pie";
  }
}

function interactDoor() {
  if (currentZone === "EXTERIOR") {
    buildings.forEach(b => {
      if (Math.hypot(player.x - b.doorX, player.y - b.doorY) < 50) {
        if (player.vehicle) interactVehicle();
        currentZone = b.id;
        document.getElementById("val-zone").innerText = b.label;
        player.x = 600; 
        player.y = 540; // Justo delante de la puerta de salida
      }
    });
  } else {
    // Entrar al vestidor dentro de la casa
    const vBox = INTERIORS.furniture.find(f => f.type === "OUTFIT_BOX");
    if (vBox && Math.hypot(player.x - (vBox.x + vBox.w/2), player.y - (vBox.y + vBox.h/2)) < 60) {
      document.getElementById("outfit-modal").style.display = "block";
      return;
    }

    // Salida del Edificio
    const door = INTERIORS.exitDoor;
    if (player.x >= door.x && player.x <= door.x + door.w && player.y >= door.y - 30) {
      const b = buildings.find(item => item.id === currentZone);
      currentZone = "EXTERIOR";
      document.getElementById("val-zone").innerText = "EXTERIOR";
      player.x = b ? b.doorX : 1200;
      player.y = b ? b.doorY + 45 : 1200;
    }
  }
}

function changeOutfit(col) { player.color = col; }
function closeOutfit() { document.getElementById("outfit-modal").style.display = "none"; }

// Sistema de Colisiones Físicas Reales
function checkCollisions(newX, newY) {
  if (currentZone === "EXTERIOR") {
    // Límites de Mundo
    if (newX < 30 || newX > WORLD.width - 30 || newY < 30 || newY > WORLD.height - 30) {
      return { x: player.x, y: player.y };
    }
    // Colisión con Edificios (si no va volando en Helicóptero)
    if (!player.vehicle || player.vehicle.type !== "HELI") {
      for (let b of buildings) {
        if (newX > b.x - 10 && newX < b.x + b.w + 10 && newY > b.y - 10 && newY < b.y + b.h + 10) {
          return { x: player.x, y: player.y };
        }
      }
    }
  } else {
    // Límites de Paredes en Interiores
    const ib = INTERIORS.bounds;
    if (newX - player.radius < ib.x || newX + player.radius > ib.x + ib.w ||
        newY - player.radius < ib.y || newY + player.radius > ib.y + ib.h) {
      return { x: player.x, y: player.y };
    }
    // Colisión con Muebles
    for (let f of INTERIORS.furniture) {
      if (newX > f.x - 10 && newX < f.x + f.w + 10 && newY > f.y - 10 && newY < f.y + f.h + 10) {
        return { x: player.x, y: player.y };
      }
    }
  }
  return { x: newX, y: newY };
}

function update() {
  let moveX = 0, moveY = 0;
  const activeSpeed = player.vehicle ? player.vehicle.speed : player.speed;

  if (keys.up) moveY -= 1;
  if (keys.down) moveY += 1;
  if (keys.left) moveX -= 1;
  if (keys.right) moveX += 1;

  if (moveX !== 0 || moveY !== 0) {
    const len = Math.hypot(moveX, moveY);
    player.dirX = moveX / len;
    player.dirY = moveY / len;
    player.angle = Math.atan2(player.dirY, player.dirX);

    const nextX = player.x + player.dirX * activeSpeed;
    const nextY = player.y + player.dirY * activeSpeed;

    const validatedPos = checkCollisions(nextX, nextY);
    player.x = validatedPos.x;
    player.y = validatedPos.y;

    if (player.vehicle) {
      player.vehicle.x = player.x;
      player.vehicle.y = player.y;
      player.vehicle.angle = player.angle;
    }
  }

  heliRotorAngle += 0.35;
  if (muzzleFlashTime > 0) muzzleFlashTime--;

  // Cámara
  if (currentZone === "EXTERIOR") {
    camera.x = player.x - canvas.width / 2;
    camera.y = player.y - canvas.height / 2;
  } else {
    camera.x = 0; camera.y = 0;
  }

  // Actualización de Balas
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.x += b.vx;
    b.y += b.vy;
    b.life--;

    if (currentZone === "EXTERIOR") {
      enemies.forEach(e => {
        if (e.active && Math.hypot(b.x - e.x, b.y - e.y) < (b.isCannon ? 35 : 22)) {
          e.hp -= b.damage;
          b.life = 0;
          if (e.hp <= 0) {
            e.active = false;
            targetsDefeated++;
            player.cash += 200;
            document.getElementById("val-targets").innerText = targetsDefeated;
            document.getElementById("val-cash").innerText = player.cash;
          }
        }
      });
    }

    if (b.life <= 0) bullets.splice(i, 1);
  }

  // Movimiento de Enemigos
  if (currentZone === "EXTERIOR") {
    enemies.forEach(e => {
      if (e.active) {
        e.x += e.dirX * 0.9;
        e.y += e.dirY * 0.9;
        if (Math.random() < 0.02) {
          e.dirX = (Math.random() - 0.5) * 2;
          e.dirY = (Math.random() - 0.5) * 2;
        }
      }
    });
  }
}

// Dibujar Vehículos con Sombras y Detalles
function drawVehicle(v) {
  ctx.save();
  ctx.translate(v.x - camera.x, v.y - camera.y);
  ctx.rotate(v.angle + Math.PI/2);

  // Sombra del vehículo
  ctx.fillStyle = "rgba(0, 0, 0, 0.4)";
  ctx.fillRect(-v.w/2 + 6, -v.h/2 + 6, v.w, v.h);

  if (v.type === "CAR_SUPER") {
    // Neón Inferior
    ctx.shadowColor = "#ff007f";
    ctx.shadowBlur = 18;
    ctx.fillStyle = v.color;
    ctx.fillRect(-v.w/2, -v.h/2, v.w, v.h);
    ctx.shadowBlur = 0;

    // Detalles Aerodinámicos
    ctx.fillStyle = "#111827";
    ctx.fillRect(-v.w/2 - 2, v.h/2 - 8, v.w + 4, 8); // Alerón
    ctx.fillStyle = "#1f2937";
    ctx.fillRect(-v.w/2 + 4, -v.h/2 + 16, v.w - 8, 22); // Parabrisas
    ctx.fillStyle = "#ffe600";
    ctx.fillRect(-v.w/2 + 2, -v.h/2 - 2, 8, 4); // Faros
    ctx.fillRect(v.w/2 - 10, -v.h/2 - 2, 8, 4);
  } 
  else if (v.type === "CAR_SEDAN") {
    ctx.fillStyle = v.color;
    ctx.fillRect(-v.w/2, -v.h/2, v.w, v.h);
    ctx.fillStyle = "#111";
    ctx.fillRect(-v.w/2 + 4, -v.h/2 + 14, v.w - 8, 18);
  } 
  else if (v.type === "BIKE") {
    ctx.fillStyle = "#111";
    ctx.fillRect(-4, -v.h/2, 8, 14); // Rueda delantera
    ctx.fillRect(-4, v.h/2 - 14, 8, 14); // Rueda trasera
    ctx.fillStyle = v.color;
    ctx.fillRect(-v.w/2, -8, v.w, 22);
  } 
  else if (v.type === "HELI") {
    ctx.fillStyle = v.color;
    ctx.beginPath();
    ctx.ellipse(0, 0, v.w/2, v.h/3, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.fillRect(-5, v.h/3, 10, 35);
    // Hélice Animada
    ctx.save();
    ctx.rotate(heliRotorAngle);
    ctx.fillStyle = "rgba(255, 255, 255, 0.8)";
    ctx.fillRect(-60, -4, 120, 8);
    ctx.restore();
  } 
  else if (v.type === "TANK") {
    // Orugas
    ctx.fillStyle = "#1e293b";
    ctx.fillRect(-v.w/2 - 5, -v.h/2, 10, v.h);
    ctx.fillRect(v.w/2 - 5, -v.h/2, 10, v.h);
    // Cuerpo
    ctx.fillStyle = v.color;
    ctx.fillRect(-v.w/2, -v.h/2, v.w, v.h);
    // Torreta y Cañón
    ctx.fillStyle = "#0f172a";
    ctx.beginPath(); ctx.arc(0, 0, 18, 0, Math.PI*2); ctx.fill();
    ctx.fillRect(-5, -40, 10, 30);
  }

  ctx.restore();
}

// Personaje + Fogonazo de Disparo
function drawCharacter(x, y, angle, bodyColor) {
  ctx.save();
  ctx.translate(x - camera.x, y - camera.y);
  ctx.rotate(angle);

  // Sombra del Personaje
  ctx.fillStyle = "rgba(0, 0, 0, 0.35)";
  ctx.beginPath(); ctx.arc(3, 3, 13, 0, Math.PI * 2); ctx.fill();

  // Cuerpo
  ctx.fillStyle = bodyColor;
  ctx.beginPath(); ctx.arc(0, 0, 13, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 1.5; ctx.stroke();

  // Cabeza
  ctx.fillStyle = "#fbcfe8";
  ctx.beginPath(); ctx.arc(0, 0, 6, 0, Math.PI * 2); ctx.fill();

  // Arma
  ctx.fillStyle = "#334155";
  ctx.fillRect(6, 4, 12, 5);

  // Fogonazo / Animación de Disparo
  if (muzzleFlashTime > 0) {
    ctx.fillStyle = "#ffe600";
    ctx.beginPath(); ctx.arc(22, 6, 8, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#ffffff";
    ctx.beginPath(); ctx.arc(22, 6, 4, 0, Math.PI * 2); ctx.fill();
  }

  ctx.restore();
}

function render() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  if (currentZone === "EXTERIOR") {
    // Mapa Exterior
    ctx.fillStyle = "#090d16";
    ctx.fillRect(-camera.x, -camera.y, WORLD.width, WORLD.height);

    // Calles
    ctx.fillStyle = "#1e293b";
    ctx.fillRect(0 - camera.x, 1150 - camera.y, WORLD.width, 140);
    ctx.fillRect(1150 - camera.x, 0 - camera.y, 140, WORLD.height);

    // Líneas Amarillas de Calle
    ctx.strokeStyle = "#ffe600";
    ctx.lineWidth = 3;
    ctx.setLineDash([20, 20]);
    ctx.beginPath();
    ctx.moveTo(0 - camera.x, 1220 - camera.y);
    ctx.lineTo(WORLD.width - camera.x, 1220 - camera.y);
    ctx.stroke(); ctx.setLineDash([]);

    // Edificios
    buildings.forEach(b => {
      ctx.fillStyle = b.color;
      ctx.fillRect(b.x - camera.x, b.y - camera.y, b.w, b.h);
      ctx.strokeStyle = "#00ffff";
      ctx.lineWidth = 2;
      ctx.strokeRect(b.x - camera.x, b.y - camera.y, b.w, b.h);

      // Puerta Neón Parpadeante
      ctx.fillStyle = "#ff007f";
      ctx.fillRect(b.doorX - camera.x - 18, b.doorY - camera.y - 8, 36, 12);
      ctx.fillStyle = "#00ffff";
      ctx.font = "bold 11px sans-serif";
      ctx.fillText("🚪 [ENTRAR]", b.doorX - camera.x - 28, b.doorY - camera.y - 14);
      ctx.fillText(b.label, b.x - camera.x, b.y - camera.y - 8);
    });

    // Vehículos
    vehicles.forEach(v => drawVehicle(v));

    // Enemigos
    enemies.forEach(e => {
      if (e.active) drawCharacter(e.x, e.y, Math.atan2(e.dirY, e.dirX), "#ef4444");
    });

  } else {
    // RENDER DE INTERIOR (Habitaciones y Muebles)
    const ib = INTERIORS.bounds;

    // Fondo del cuarto
    ctx.fillStyle = "#0f172a";
    ctx.fillRect(ib.x, ib.y, ib.w, ib.h);
    ctx.strokeStyle = "#00ffff";
    ctx.lineWidth = 4;
    ctx.strokeRect(ib.x, ib.y, ib.w, ib.h);

    // Muebles Detallados
    INTERIORS.furniture.forEach(f => {
      ctx.fillStyle = "rgba(0,0,0,0.4)";
      ctx.fillRect(f.x + 5, f.y + 5, f.w, f.h); // Sombra mueble

      ctx.fillStyle = f.color;
      ctx.fillRect(f.x, f.y, f.w, f.h);
      ctx.strokeStyle = "#ffffff";
      ctx.lineWidth = 1;
      ctx.strokeRect(f.x, f.y, f.w, f.h);

      ctx.fillStyle = "#ffffff";
      ctx.font = "10px sans-serif";
      ctx.fillText(f.label, f.x + 5, f.y + 18);
    });

    // Puerta de Salida
    const door = INTERIORS.exitDoor;
    ctx.fillStyle = "#ef4444";
    ctx.fillRect(door.x, door.y, door.w, door.h);
    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 12px sans-serif";
    ctx.fillText("🚪 SALIDA [F]", door.x + 5, door.y - 6);
  }

  // Balas
  bullets.forEach(b => {
    ctx.fillStyle = b.isCannon ? "#ff5500" : "#ffe600";
    ctx.beginPath();
    ctx.arc(b.x - camera.x, b.y - camera.y, b.isCannon ? 7 : 3.5, 0, Math.PI * 2);
    ctx.fill();
  });

  // Jugador a pie
  if (!player.vehicle) {
    drawCharacter(player.x, player.y, player.angle, player.color);
  }

  renderMinimap();
}

function renderMinimap() {
  mCtx.clearRect(0, 0, 110, 110);
  mCtx.fillStyle = "#04060a";
  mCtx.fillRect(0, 0, 110, 110);

  const scale = 110 / WORLD.width;

  if (currentZone === "EXTERIOR") {
    vehicles.forEach(v => {
      mCtx.fillStyle = v.type === "TANK" ? "#455a64" : "#00ffff";
      mCtx.fillRect(v.x * scale, v.y * scale, 3, 3);
    });

    enemies.forEach(e => {
      if (e.active) {
        mCtx.fillStyle = "#ef4444";
        mCtx.beginPath();
        mCtx.arc(e.x * scale, e.y * scale, 3, 0, Math.PI * 2);
        mCtx.fill();
      }
    });
  }

  mCtx.fillStyle = "#ff007f";
  mCtx.beginPath();
  mCtx.arc(player.x * scale, player.y * scale, 4.5, 0, Math.PI * 2);
  mCtx.fill();
}

function gameLoop() {
  update();
  render();
  requestAnimationFrame(gameLoop);
}

function toggleFullscreen() {
  if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(()=>{});
  else if (document.exitFullscreen) document.exitFullscreen();
}

gameLoop();
</script>
