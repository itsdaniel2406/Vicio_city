<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Vicio City by Dani - v2.7</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; touch-action: none; }
        body, html { width: 100vw; height: 100vh; overflow: hidden; background: #05050a; font-family: 'Segoe UI', Roboto, sans-serif; color: #fff; }
        canvas { display: block; width: 100vw; height: 100vh; }

        /* Advertencia Orientación */
        #orient-warning { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #05050a; color: #ff007f; z-index: 1000; justify-content: center; align-items: center; font-size: 18px; font-weight: bold; text-align: center; padding: 20px; }
        @media (orientation: portrait) { #orient-warning { display: flex; } }

        /* HUD - Izquierda */
        .hud-left { position: absolute; top: 10px; left: 10px; display: flex; flex-direction: column; gap: 4px; z-index: 20; pointer-events: none; }
        .hud-title { background: linear-gradient(135deg, #ff007f, #00f0ff); padding: 4px 10px; border-radius: 6px; font-size: 12px; font-weight: 900; text-align: center; box-shadow: 0 0 10px rgba(255,0,127,0.5); text-transform: uppercase; letter-spacing: 0.5px; }
        .hud-card { background: rgba(10, 15, 30, 0.88); border: 1.5px solid #00f0ff; padding: 5px 12px; border-radius: 8px; color: #fff; font-size: 11px; font-weight: bold; box-shadow: 0 0 10px rgba(0,240,255,0.25); text-shadow: 0 0 4px #000; }
        .mission-card { border-color: #ffee00; color: #ffee00; background: rgba(25, 20, 5, 0.9); }

        /* Top Right */
        .top-right-container { position: absolute; top: 10px; right: 10px; display: flex; flex-direction: column; align-items: flex-end; gap: 8px; z-index: 20; }
        .save-load-btns { display: flex; gap: 6px; }
        .btn-small-sys { background: rgba(5,5,15,0.9); border: 1.5px solid #00f0ff; color: #00f0ff; padding: 5px 10px; border-radius: 6px; font-size: 10px; font-weight: bold; cursor: pointer; pointer-events: auto; }
        .btn-small-sys:active { background: #00f0ff; color: #000; }
        
        #minimap-container { width: 110px; height: 110px; border-radius: 50%; border: 3px solid #ff007f; background: rgba(5,5,10,0.95); overflow: hidden; box-shadow: 0 0 12px rgba(255,0,127,0.6); }
        #minimap { width: 100%; height: 100%; }

        /* Botón Interacción Contextual */
        #interact-btn { display: none; position: absolute; top: 35%; left: 50%; transform: translate(-50%, -50%); background: linear-gradient(135deg, #ffee00, #ff8800); color: #000; font-size: 13px; font-weight: 900; padding: 12px 22px; border-radius: 25px; border: 2px solid #fff; box-shadow: 0 0 20px #ffee00; z-index: 95; cursor: pointer; pointer-events: auto; animation: pulse 0.8s infinite alternate; }
        @keyframes pulse { from { transform: translate(-50%, -50%) scale(1); } to { transform: translate(-50%, -50%) scale(1.08); } }

        /* Cuadro de Diálogo NPC */
        #dialog-box { display: none; position: absolute; bottom: 95px; left: 50%; transform: translateX(-50%); width: 85%; max-width: 500px; background: rgba(10, 15, 30, 0.95); border: 2px solid #00f0ff; border-radius: 12px; padding: 12px 18px; z-index: 90; box-shadow: 0 0 15px rgba(0,240,255,0.4); text-align: center; }
        #dialog-title { color: #ff007f; font-weight: 900; font-size: 14px; margin-bottom: 4px; text-transform: uppercase; }
        #dialog-text { color: #fff; font-size: 13px; margin-bottom: 8px; }

        /* NUEVA CRUCIETA REUBICADA Y ERGONÓMICA */
        .dpad-container { position: absolute; bottom: 35px; left: 35px; pointer-events: auto; z-index: 20; }
        .dpad { display: grid; grid-template-columns: repeat(3, 56px); grid-template-rows: repeat(3, 56px); gap: 6px; }
        .btn { background: rgba(10, 20, 35, 0.85); border: 2px solid #00f0ff; border-radius: 14px; color: #00f0ff; font-size: 22px; font-weight: bold; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 12px rgba(0,240,255,0.3); transition: background 0.1s, transform 0.1s; }
        .btn:active, .btn.pressed { background: rgba(0, 240, 255, 0.5); transform: scale(0.92); color: #fff; box-shadow: 0 0 20px #00f0ff; }
        .btn-up { grid-column: 2; grid-row: 1; }
        .btn-left { grid-column: 1; grid-row: 2; }
        .btn-right { grid-column: 3; grid-row: 2; }
        .btn-down { grid-column: 2; grid-row: 3; }
        
        /* Controles Derecha */
        .controls-right { position: absolute; bottom: 35px; right: 35px; display: flex; gap: 12px; align-items: flex-end; z-index: 20; pointer-events: auto; }
        .btn-act { width: 56px; height: 56px; border-radius: 50%; border: 2px solid #ff007f; color: #ff007f; font-size: 20px; background: rgba(15,5,20,0.85); display: flex; align-items: center; justify-content: center; box-shadow: 0 0 12px rgba(255,0,127,0.4); transition: transform 0.1s; }
        .btn-act:active { background: rgba(255, 0, 127, 0.5); transform: scale(0.92); }
    </style>
</head>
<body>

    <div id="orient-warning">🔄 GIRA TU DISPOSITIVO A MODO HORIZONTAL PARA JUGAR</div>

    <div class="hud-left">
        <div class="hud-title">Vicio City by Dani <span style="font-size:9px; color:#fff; font-weight:normal;">v2.7</span></div>
        <div class="hud-card">NIVEL: <span id="lvl-val" style="color:#ff007f">1</span> (<span id="xp-val">0</span>/100 XP)</div>
        <div class="hud-card">SALUD: <span id="h-val" style="color:#00ff88">100</span>/<span id="maxh-val">100</span></div>
        <div class="hud-card">DINERO: <span id="m-val" style="color:#00f0ff">$100</span></div>
        <div class="hud-card">BUSCADO: <span id="wanted-val" style="color:#ffcc00">☆☆☆☆☆</span></div>
        <div class="hud-card mission-card">🎯 MISIÓN: <span id="mission-val">Cargando...</span></div>
    </div>

    <div class="top-right-container">
        <div class="save-load-btns">
            <button class="btn-small-sys" onclick="saveGame()">💾 GUARDAR</button>
            <button class="btn-small-sys" onclick="loadGame()">📂 CARGAR</button>
        </div>
        <div id="minimap-container">
            <canvas id="minimap"></canvas>
        </div>
    </div>

    <button id="interact-btn" onclick="triggerContextInteraction()">⚡ INTERACTUAR</button>

    <div id="dialog-box">
        <div id="dialog-title">NPC</div>
        <div id="dialog-text">Hola, ¿qué tal?</div>
    </div>

    <canvas id="game"></canvas>

    <div class="dpad-container">
        <div class="dpad">
            <div class="btn btn-up" id="b-up">▲</div>
            <div class="btn btn-left" id="b-left">◀</div>
            <div class="btn btn-right" id="b-right">▶</div>
            <div class="btn btn-down" id="b-down">▼</div>
        </div>
    </div>

    <div class="controls-right">
        <div class="btn-act" onclick="toggleFullscreen()">🖥️</div>
        <div class="btn-act" id="b-enter">🚗</div>
        <div class="btn-act" id="b-shoot" style="border-color:#ff0055; color:#ff0055;">🔫</div>
    </div>

    <script>
        const GAME_VERSION = "v2.7";
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        const mCanvas = document.getElementById('minimap');
        const mCtx = mCanvas.getContext('2d');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            mCanvas.width = 110; mCanvas.height = 110;
        }
        window.addEventListener('resize', resize);
        resize();

        function toggleFullscreen() {
            if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(()=>{});
            else document.exitFullscreen().catch(()=>{});
        }

        let currentInterior = null; 
        let activeDoorBuilding = null;
        let activeFurniture = null;
        let activeNpcTalk = null;
        let rotorAngle = 0;
        let dialogTimeout = null;

        const clothesPalette = ['#00f0ff', '#ff007f', '#00ff88', '#ffee00', '#ff5500', '#ffffff', '#aa00ff'];
        let currentClothIndex = 0;

        const player = { 
            x: 800, y: 1200, angle: 0, speed: 3.8, radius: 10, inCar: false, 
            health: 100, maxHealth: 100, money: 100, wanted: 0, level: 1, xp: 0, 
            clothColor: clothesPalette[0], carRef: null, savedExteriorX: 800, savedExteriorY: 1200
        };
        const keys = { up: false, down: false, left: false, right: false };

        const bullets = [];
        const npcs = [];
        const loot = [];

        const skyVehicles = [
            { x: -500, y: 800, vx: 3.5, vy: 0.2, type: 'commercial_plane', scale: 1.2 },
            { x: 3000, y: 2000, vx: -4.5, vy: -0.5, type: 'jet', scale: 0.9 },
            { x: 1500, y: 500, vx: 2.0, vy: 0.8, type: 'police_heli', scale: 1.0 }
        ];

        const roads = [
            { x: 200, y: 1100, w: 5000, h: 140 },
            { x: 200, y: 2500, w: 5000, h: 140 },
            { x: 200, y: 4000, w: 5000, h: 140 },
            { x: 1200, y: 200, w: 140, h: 4800 },
            { x: 2800, y: 200, w: 140, h: 4800 },
            { x: 4400, y: 200, w: 140, h: 4800 }
        ];

        const buildings = [
            { id: 'home', x: 600, y: 800, w: 260, h: 220, color: '#1c2d42', roof: '#0f1b29', label: '🏠 MI CASA', doorX: 730, doorY: 1020 },
            { id: 'pharma', x: 1500, y: 800, w: 260, h: 220, color: '#133e2b', roof: '#0a2318', label: '🏥 FARMACIA', doorX: 1630, doorY: 1020 },
            { id: 'bank', x: 400, y: 1400, w: 320, h: 280, color: '#2a2238', roof: '#171221', label: '🏦 BANCO CENTRAL', doorX: 560, doorY: 1680 },
            { id: 'police', x: 1500, y: 1400, w: 340, h: 280, color: '#162b4c', roof: '#0d1a30', label: '🚔 COMISARÍA CENTRAL', doorX: 1670, doorY: 1680 },
            { id: 'airport', x: 3200, y: 2800, w: 800, h: 500, color: '#2b2b2b', roof: '#1f1f1f', label: '✈️ AEROPUERTO INTERNACIONAL', doorX: 3600, doorY: 3300 },
            { id: 'casino', x: 3000, y: 800, w: 380, h: 300, color: '#4a1232', roof: '#2b0a1c', label: '🎰 CASINO NEÓN', doorX: 3190, doorY: 1100 },
            { id: 'dealership', x: 4600, y: 800, w: 360, h: 280, color: '#12384a', roof: '#0b202b', label: '🏎️ CONCESIONARIA', doorX: 4780, doorY: 1080 },
            { id: 'hospital', x: 600, y: 2700, w: 350, h: 300, color: '#3a1616', roof: '#210d0d', label: '🚑 HOSPITAL GENERAL', doorX: 775, doorY: 3000 }
        ];

        // INTERIORES DETALLADOS Y MUEBLES CON TEXTURA HD
        const interiors = {
            'home': {
                name: 'Mi Casa', w: 600, h: 500,
                furniture: [
                    { id: 'bed', type: 'bed', name: 'Cama Comfort', x: 80, y: 80, w: 90, h: 130, color: '#00f0ff', action: 'rest_heal' },
                    { id: 'tv', type: 'tv', name: 'TV Smart HD', x: 260, y: 50, w: 110, h: 25, color: '#ff007f' },
                    { id: 'sofa', type: 'sofa', name: 'Sofá Cuero', x: 250, y: 140, w: 130, h: 55, color: '#334455' },
                    { id: 'wardrobe', type: 'wardrobe', name: 'Armario de Ropa', x: 470, y: 80, w: 80, h: 110, color: '#ffee00', action: 'change_cloth' }
                ],
                exitDoor: { x: 300, y: 470 }
            },
            'pharma': {
                name: 'Farmacia & Botica', w: 600, h: 500,
                furniture: [
                    { id: 'counter', type: 'counter', name: 'Mostrador Médico ($50)', x: 150, y: 160, w: 300, h: 45, color: '#00ff88', action: 'buy_heal' },
                    { id: 'shelf', type: 'shelf', name: 'Estante de Remedios', x: 80, y: 60, w: 440, h: 35, color: '#115522' },
                    { id: 'bed', type: 'bed', name: 'Camilla de Urgencia', x: 80, y: 310, w: 70, h: 110, color: '#ffffff' }
                ],
                exitDoor: { x: 300, y: 470 }
            },
            'bank': {
                name: 'Bóveda y Banco', w: 700, h: 550,
                furniture: [
                    { id: 'vault', type: 'vault', name: 'Caja Fuerte Principal', x: 280, y: 80, w: 140, h: 100, color: '#ffcc00', action: 'rob_vault' },
                    { id: 'counter', type: 'counter', name: 'Ventanilla Atención', x: 150, y: 260, w: 400, h: 40, color: '#333' }
                ],
                exitDoor: { x: 350, y: 520 }
            },
            'casino': {
                name: 'Casino Neón VIP', w: 750, h: 550,
                furniture: [
                    { id: 'roulette', type: 'roulette', name: 'Mesa de Ruleta VIP ($100)', x: 120, y: 120, w: 160, h: 90, color: '#0a3818', action: 'gamble' },
                    { id: 'slots', type: 'slots', name: 'Tragamonedas Neón', x: 380, y: 80, w: 260, h: 45, color: '#ff007f', action: 'gamble' },
                    { id: 'bar', type: 'counter', name: 'Barra del Casino', x: 200, y: 320, w: 350, h: 50, color: '#4a1232' }
                ],
                exitDoor: { x: 375, y: 520 }
            },
            'airport': {
                name: 'Terminal de Aeropuerto', w: 900, h: 700,
                furniture: [
                    { id: 'seats', type: 'seats', name: 'Asientos Salón', x: 150, y: 200, w: 200, h: 40, color: '#444' },
                    { id: 'scanner', type: 'scanner', name: 'Escaner Rayos X', x: 450, y: 150, w: 60, h: 120, color: '#ffee00' }
                ],
                exitDoor: { x: 450, y: 670 }
            }
        };

        const cars = [
            { x: 750, y: 1060, angle: 0, speed: 5.5, health: 100, w: 46, h: 22, color: '#ff0055', type: 'sports' },
            { x: 1700, y: 1720, angle: 0, speed: 5.0, health: 120, w: 48, h: 22, color: '#0055ff', type: 'police' },
            { x: 3600, y: 3100, angle: 0, speed: 5.2, health: 160, w: 50, h: 50, color: '#00ff88', type: 'heli' },
            { x: 4800, y: 1120, angle: 0, speed: 7.2, health: 100, w: 48, h: 22, color: '#ffee00', type: 'hypercar' }
        ];

        // DIÁLOGOS Y NPCS
        const npcQuotes = {
            civilian: ["¡Qué lindo día en Vicio City!", "¿Has visto el casino?", "¡Cuidado con los pandilleros!", "Tengo prisa, lo siento.", "¡El alcalde debería reparar las calles!"],
            police: ["Circule, no hay nada que ver.", "Mantén las manos donde pueda verlas.", "Si buscas problemas, me encontrarás a mí.", "Todo en orden por aquí."],
            gangster: ["¿Qué miras, novato?", "¡Dame tu dinero o habrá problemas!", "Esta zona es nuestra.", "¿Tienes cigarrillos?"]
        };

        for(let i=0; i<60; i++) {
            npcs.push({ 
                id: i,
                x: Math.random()*4800 + 200, y: Math.random()*4000 + 200, 
                angle: Math.random()*6, speed: 1.0, alive: true, 
                role: (i % 5 === 0) ? 'police' : ((i % 3 === 0) ? 'gangster' : 'civilian')
            });
        }

        // LISTA DE MISIOMES CON PUNTOS DE DESTINO PARA SEGUIMIENTO (DIAMANTE EN MINIMAPA)
        const missionList = [
            { text: "Visita el Banco Central y entra a la bóveda", type: "bank", targetX: 560, targetY: 1680 },
            { text: "Elimina 3 Pandilleros en la ciudad", type: "kills", target: 3, current: 0, targetX: 2000, targetY: 2000 },
            { text: "Pilota un Helicóptero en el Aeropuerto", type: "heli", targetX: 3600, targetY: 3100 },
            { text: "Entra a la Farmacia a sanarte", type: "pharma", targetX: 1630, targetY: 1020 },
            { text: "Prueba tu suerte en el Casino Neón", type: "casino", targetX: 3190, targetY: 1100 }
        ];
        let currentMission = missionList[0];

        function checkMissionProgress(type) {
            if(currentMission.type === type) {
                if(type === 'kills') {
                    currentMission.current++;
                    if(currentMission.current >= currentMission.target) completeMission();
                } else {
                    completeMission();
                }
            }
        }

        function completeMission() {
            player.money += 500;
            addXP(75);
            showDialog("SISTEMA", "🎉 ¡MISIÓN COMPLETADA! +$500 | +75 XP");
            currentMission = missionList[Math.floor(Math.random()*missionList.length)];
            if(currentMission.type === 'kills') currentMission.current = 0;
            updateHUD();
        }

        function showDialog(title, text) {
            const box = document.getElementById('dialog-box');
            document.getElementById('dialog-title').innerText = title;
            document.getElementById('dialog-text').innerText = text;
            box.style.display = 'block';

            if(dialogTimeout) clearTimeout(dialogTimeout);
            dialogTimeout = setTimeout(() => { box.style.display = 'none'; }, 4000);
        }

        // BIND TOUCH PARA CRUCIETA ERGONÓMICA
        function bindTouch(id, key) {
            const el = document.getElementById(id);
            const start = (e) => { e.preventDefault(); keys[key] = true; el.classList.add('pressed'); };
            const end = (e) => { e.preventDefault(); keys[key] = false; el.classList.remove('pressed'); };
            el.addEventListener('touchstart', start); el.addEventListener('touchend', end);
            el.addEventListener('mousedown', start); el.addEventListener('mouseup', end);
        }
        bindTouch('b-up', 'up'); bindTouch('b-down', 'down');
        bindTouch('b-left', 'left'); bindTouch('b-right', 'right');

        document.getElementById('b-enter').addEventListener('click', toggleCar);
        document.getElementById('b-shoot').addEventListener('click', shoot);

        window.addEventListener('keydown', e => {
            if(e.key==='w'||e.key==='ArrowUp') keys.up=true;
            if(e.key==='s'||e.key==='ArrowDown') keys.down=true;
            if(e.key==='a'||e.key==='ArrowLeft') keys.left=true;
            if(e.key==='d'||e.key==='ArrowRight') keys.right=true;
            if(e.key===' ') toggleCar();
            if(e.key==='f') shoot();
            if(e.key==='e') triggerContextInteraction();
        });
        window.addEventListener('keyup', e => {
            if(e.key==='w'||e.key==='ArrowUp') keys.up=false;
            if(e.key==='s'||e.key==='ArrowDown') keys.down=false;
            if(e.key==='a'||e.key==='ArrowLeft') keys.left=false;
            if(e.key==='d'||e.key==='ArrowRight') keys.right=false;
        });

        function addXP(amount) {
            player.xp += amount;
            if(player.xp >= 100) {
                player.level++; player.xp -= 100;
                player.maxHealth += 25; player.health = player.maxHealth;
            }
            updateHUD();
        }

        function updateHUD() {
            document.getElementById('h-val').innerText = Math.max(0, Math.floor(player.health));
            document.getElementById('maxh-val').innerText = player.maxHealth;
            document.getElementById('lvl-val').innerText = player.level;
            document.getElementById('xp-val').innerText = player.xp;
            document.getElementById('m-val').innerText = "$" + player.money;
            document.getElementById('wanted-val').innerText = "★".repeat(player.wanted) + "☆".repeat(5 - player.wanted);
            document.getElementById('mission-val').innerText = currentMission.text + (currentMission.type==='kills'?` (${currentMission.current}/${currentMission.target})` : '');
        }
        updateHUD();

        function triggerContextInteraction() {
            // 1. Hablar con NPC cercano
            if(activeNpcTalk) {
                const quotes = npcQuotes[activeNpcTalk.role];
                const text = quotes[Math.floor(Math.random()*quotes.length)];
                let title = "CIUDADANO";
                if(activeNpcTalk.role === 'police') title = "POLICÍA";
                if(activeNpcTalk.role === 'gangster') title = "PANDILLERO";
                showDialog(title, text);
                return;
            }

            // 2. Muebles de interior
            if(currentInterior && activeFurniture) {
                if(activeFurniture.action === 'change_cloth') {
                    currentClothIndex = (currentClothIndex + 1) % clothesPalette.length;
                    player.clothColor = clothesPalette[currentClothIndex];
                    showDialog("ARMARIO", "🎨 Te has cambiado de ropa. ¡Nuevo estilo!");
                } else if(activeFurniture.action === 'buy_heal') {
                    if(player.money >= 50) {
                        player.money -= 50;
                        player.health = player.maxHealth;
                        updateHUD();
                        showDialog("FARMACIA", "💉 Salud restaurada al máximo por $50.");
                        checkMissionProgress('pharma');
                    } else {
                        showDialog("FARMACIA", "❌ No tienes suficiente dinero ($50 requerido).");
                    }
                } else if(activeFurniture.action === 'rest_heal') {
                    player.health = player.maxHealth;
                    updateHUD();
                    showDialog("CASA", "😴 Descansaste en tu cama. Salud restaurada.");
                } else if(activeFurniture.action === 'rob_vault') {
                    player.money += 300;
                    player.wanted = Math.min(5, player.wanted + 2);
                    updateHUD();
                    showDialog("ALERTA BANCO", "💰 ¡Robaste la Bóveda! +$300 (Buscado Nivel " + player.wanted + ")");
                    checkMissionProgress('bank');
                } else if(activeFurniture.action === 'gamble') {
                    if(player.money >= 50) {
                        player.money -= 50;
                        const win = Math.random() > 0.45;
                        if(win) {
                            player.money += 120;
                            showDialog("CASINO NEÓN", "🎰 ¡GANASTE! Recibes $120.");
                        } else {
                            showDialog("CASINO NEÓN", "💸 Mala suerte, perdiste $50. ¡Intenta de nuevo!");
                        }
                        updateHUD();
                        checkMissionProgress('casino');
                    } else {
                        showDialog("CASINO NEÓN", "❌ Necesitas al menos $50 para jugar.");
                    }
                }
                return;
            }

            // 3. Entrar / Salir de Edificios
            if(currentInterior) {
                player.x = player.savedExteriorX;
                player.y = player.savedExteriorY;
                currentInterior = null;
                showDialog("CIUDAD", "Regresaste a las calles de Vicio City.");
            } else if(activeDoorBuilding) {
                player.savedExteriorX = activeDoorBuilding.doorX;
                player.savedExteriorY = activeDoorBuilding.doorY + 40;
                currentInterior = activeDoorBuilding.id;
                
                const targetInt = interiors[currentInterior];
                if(targetInt) {
                    player.x = targetInt.exitDoor.x;
                    player.y = targetInt.exitDoor.y - 40;
                } else {
                    player.x = 200; player.y = 200;
                }
                
                showDialog("INTERIOR", "Entraste a: " + activeDoorBuilding.label);
                checkMissionProgress(currentInterior);
            }
        }

        function toggleCar() {
            if(currentInterior) return;
            if(player.inCar) {
                player.inCar = false;
                player.x = player.carRef.x + 35; player.y = player.carRef.y;
                player.carRef = null;
            } else {
                cars.forEach(c => {
                    if(c.health > 0 && Math.hypot(c.x - player.x, c.y - player.y) < 50) {
                        player.inCar = true; player.carRef = c;
                        if(c.type === 'heli') checkMissionProgress('heli');
                    }
                });
            }
        }

        function shoot() {
            const angle = player.inCar ? player.carRef.angle : player.angle;
            const px = player.inCar ? player.carRef.x : player.x;
            const py = player.inCar ? player.carRef.y : player.y;

            bullets.push({
                x: px + Math.cos(angle) * 24,
                y: py + Math.sin(angle) * 24,
                vx: Math.cos(angle) * 14,
                vy: Math.sin(angle) * 14,
                life: 40
            });
        }

        function saveGame() {
            localStorage.setItem('vicio_city_by_dani_save', JSON.stringify({ player, GAME_VERSION }));
            showDialog("SISTEMA", "💾 Progreso Guardado correctamente.");
        }

        function loadGame() {
            const data = localStorage.getItem('vicio_city_by_dani_save');
            if(data) {
                Object.assign(player, JSON.parse(data).player);
                updateHUD(); 
                showDialog("SISTEMA", "📂 Progreso Cargado.");
            }
        }

        function checkBuildingCollision(x, y, radius) {
            if(currentInterior) return false;
            for(let b of buildings) {
                if(x + radius > b.x && x - radius < b.x + b.w && y + radius > b.y && y - radius < b.y + b.h) return true;
            }
            return false;
        }

        function update() {
            rotorAngle += 0.35;

            skyVehicles.forEach(sv => {
                sv.x += sv.vx; sv.y += sv.vy;
                if(sv.x > 5500) sv.x = -600;
                if(sv.x < -600) sv.x = 5500;
            });

            let dx = 0, dy = 0;
            if(keys.up) dy -= 1;
            if(keys.down) dy += 1;
            if(keys.left) dx -= 1;
            if(keys.right) dx += 1;

            const activeObj = player.inCar ? player.carRef : player;
            const spd = player.inCar ? activeObj.speed : player.speed;

            if(dx !== 0 || dy !== 0) {
                activeObj.angle = Math.atan2(dy, dx);
                let nx = activeObj.x + dx * spd;
                let ny = activeObj.y + dy * spd;

                if(!checkBuildingCollision(nx, activeObj.y, 12)) activeObj.x = nx;
                if(!checkBuildingCollision(activeObj.x, ny, 12)) activeObj.y = ny;
            }

            if(player.inCar) { player.x = player.carRef.x; player.y = player.carRef.y; }

            // DETECCIÓN DE INTERACCIÓN
            activeDoorBuilding = null;
            activeFurniture = null;
            activeNpcTalk = null;
            const btn = document.getElementById('interact-btn');

            if(currentInterior) {
                const data = interiors[currentInterior];
                if(data) {
                    data.furniture.forEach(f => {
                        const cx = f.x + f.w/2; const cy = f.y + f.h/2;
                        if(Math.hypot(player.x - cx, player.y - cy) < 65) {
                            activeFurniture = f;
                        }
                    });

                    const door = data.exitDoor;
                    if(Math.hypot(player.x - door.x, player.y - door.y) < 45) {
                        btn.style.display = 'block';
                        btn.innerText = "🚪 SALIR A LA CIUDAD";
                    } else if(activeFurniture) {
                        btn.style.display = 'block';
                        btn.innerText = "⚡ " + activeFurniture.name;
                    } else {
                        btn.style.display = 'none';
                    }
                }

            } else {
                if(!player.inCar) {
                    buildings.forEach(b => {
                        if(Math.hypot(player.x - b.doorX, player.y - b.doorY) < 45) activeDoorBuilding = b;
                    });

                    npcs.forEach(npc => {
                        if(npc.alive && Math.hypot(player.x - npc.x, player.y - npc.y) < 35) {
                            activeNpcTalk = npc;
                        }
                    });
                }

                if(activeNpcTalk) {
                    btn.style.display = 'block';
                    btn.innerText = "💬 HABLAR CON NPC";
                } else if(activeDoorBuilding) {
                    btn.style.display = 'block';
                    btn.innerText = `🚪 ENTRAR A ${activeDoorBuilding.label}`;
                } else {
                    btn.style.display = 'none';
                }
            }

            // PROCESAR BALAS
            bullets.forEach((b, i) => {
                b.x += b.vx; b.y += b.vy; b.life--;
                npcs.forEach(npc => {
                    if(npc.alive && Math.hypot(npc.x - b.x, npc.y - b.y) < 14) {
                        npc.alive = false; b.life = 0;
                        loot.push({ x: npc.x, y: npc.y, amount: 60 });
                        addXP(20);
                        if(npc.role === 'gangster') checkMissionProgress('kills');
                    }
                });
                if(b.life <= 0 || checkBuildingCollision(b.x, b.y, 3)) bullets.splice(i, 1);
            });

            npcs.forEach(npc => {
                if(!npc.alive) return;
                npc.x += Math.cos(npc.angle) * npc.speed;
                npc.y += Math.sin(npc.angle) * npc.speed;
                if(checkBuildingCollision(npc.x, npc.y, 8)) npc.angle += Math.PI/2;
            });

            loot.forEach((l, i) => {
                if(Math.hypot(l.x - player.x, l.y - player.y) < 25) {
                    player.money += l.amount; loot.splice(i, 1); updateHUD();
                }
            });
        }

        function drawHuman(x, y, angle, bodyColor) {
            ctx.save();
            ctx.translate(x, y); ctx.rotate(angle);
            ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.beginPath(); ctx.arc(2, 2, 8, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = bodyColor; ctx.fillRect(-5, -7, 10, 14);
            ctx.fillStyle = '#ffcc99'; 
            ctx.fillRect(2, -8, 6, 4); ctx.fillRect(2, 4, 6, 4);
            ctx.beginPath(); ctx.arc(0, 0, 5, 0, Math.PI*2); ctx.fill();
            ctx.restore();
        }

        // RENDERIZADO HD Y TEXTURIZADO DE MUEBLES
        function drawFurnitureModel(f) {
            ctx.save();
            ctx.translate(f.x, f.y);

            // Sombra
            ctx.fillStyle = 'rgba(0,0,0,0.35)';
            ctx.fillRect(5, 5, f.w, f.h);

            if(f.type === 'roulette') {
                // Mesa Ruleta Neón HD
                let grad = ctx.createLinearGradient(0, 0, f.w, f.h);
                grad.addColorStop(0, '#0a3818'); grad.addColorStop(0.5, '#125c28'); grad.addColorStop(1, '#0a3818');
                ctx.fillStyle = grad; ctx.fillRect(0, 0, f.w, f.h);
                
                ctx.strokeStyle = '#ff007f'; ctx.lineWidth = 3; ctx.shadowColor = '#ff007f'; ctx.shadowBlur = 8;
                ctx.strokeRect(0, 0, f.w, f.h); ctx.shadowBlur = 0;

                // Rueda Ruleta
                ctx.fillStyle = '#ccaa00'; ctx.beginPath(); ctx.arc(f.w/4, f.h/2, 18, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(f.w/4, f.h/2, 10, 0, Math.PI*2); ctx.fill();
            } else if(f.type === 'slots') {
                // Tragamonedas HD
                ctx.fillStyle = '#222'; ctx.fillRect(0, 0, f.w, f.h);
                ctx.strokeStyle = '#00f0ff'; ctx.lineWidth = 2; ctx.strokeRect(0, 0, f.w, f.h);
                for(let i=0; i<4; i++) {
                    ctx.fillStyle = '#ff007f'; ctx.fillRect(15 + i*60, 8, 35, 28);
                    ctx.fillStyle = '#fff'; ctx.font = 'bold 10px monospace'; ctx.fillText("777", 22 + i*60, 25);
                }
            } else if(f.type === 'bed') {
                ctx.fillStyle = '#4a2e18'; ctx.fillRect(0, 0, f.w, f.h);
                ctx.fillStyle = '#ffffff'; ctx.fillRect(4, 15, f.w - 8, f.h - 20);
                ctx.fillStyle = f.color; ctx.fillRect(4, 4, f.w - 8, 20);
            } else if(f.type === 'wardrobe') {
                ctx.fillStyle = f.color; ctx.fillRect(0, 0, f.w, f.h);
                ctx.fillStyle = '#111'; ctx.fillRect(2, 2, f.w/2 - 3, f.h - 4); ctx.fillRect(f.w/2 + 1, 2, f.w/2 - 3, f.h - 4);
                ctx.fillStyle = '#fff'; ctx.fillRect(f.w/2 - 4, f.h/2 - 4, 3, 8); ctx.fillRect(f.w/2 + 1, f.h/2 - 4, 3, 8);
            } else if(f.type === 'tv') {
                ctx.fillStyle = '#111'; ctx.fillRect(0, 0, f.w, f.h);
                ctx.fillStyle = f.color; ctx.fillRect(3, 3, f.w - 6, f.h - 6);
            } else if(f.type === 'vault') {
                ctx.fillStyle = '#555566'; ctx.fillRect(0, 0, f.w, f.h);
                ctx.strokeStyle = '#ffee00'; ctx.lineWidth = 3; ctx.strokeRect(4, 4, f.w - 8, f.h - 8);
                ctx.fillStyle = '#ffee00'; ctx.beginPath(); ctx.arc(f.w/2, f.h/2, 16, 0, Math.PI*2); ctx.fill();
            } else {
                ctx.fillStyle = f.color; ctx.fillRect(0, 0, f.w, f.h);
                ctx.strokeStyle = 'rgba(255,255,255,0.4)'; ctx.lineWidth = 2; ctx.strokeRect(0, 0, f.w, f.h);
            }

            // Etiqueta Nombre
            ctx.fillStyle = '#ffffff'; ctx.font = 'bold 10px sans-serif'; ctx.textAlign = 'center';
            ctx.fillText(f.name, f.w/2, -6);

            ctx.restore();
        }

        function drawAircraft(sv) {
            ctx.save();
            ctx.translate(sv.x, sv.y); ctx.scale(sv.scale, sv.scale);
            ctx.fillStyle = 'rgba(0,0,0,0.2)'; ctx.beginPath(); ctx.ellipse(0, 80, 50, 12, 0, 0, Math.PI*2); ctx.fill();

            if(sv.type === 'commercial_plane') {
                ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.ellipse(0, 0, 70, 14, 0, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = '#dddddd'; ctx.fillRect(-15, -60, 30, 120);
            } else if(sv.type === 'jet') {
                ctx.fillStyle = '#445566';
                ctx.beginPath(); ctx.moveTo(50, 0); ctx.lineTo(-40, -30); ctx.lineTo(-25, 0); ctx.lineTo(-40, 30); ctx.closePath(); ctx.fill();
            } else {
                ctx.fillStyle = '#223344'; ctx.beginPath(); ctx.ellipse(0, 0, 28, 14, 0, 0, Math.PI*2); ctx.fill();
                ctx.fillRect(-45, -3, 30, 6);
                ctx.save(); ctx.rotate(rotorAngle);
                ctx.strokeStyle = 'rgba(255,255,255,0.85)'; ctx.lineWidth = 4;
                ctx.beginPath(); ctx.moveTo(-50, 0); ctx.lineTo(50, 0); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(0, -50); ctx.lineTo(0, 50); ctx.stroke();
                ctx.restore();
            }
            ctx.restore();
        }

        function draw() {
            ctx.fillStyle = '#0c140d'; ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.save();
            ctx.translate(canvas.width/2 - player.x, canvas.height/2 - player.y);

            if(currentInterior) {
                const data = interiors[currentInterior];
                if(data) {
                    ctx.fillStyle = '#181e2b'; ctx.fillRect(0, 0, data.w, data.h);
                    ctx.strokeStyle = '#00f0ff'; ctx.lineWidth = 6; ctx.strokeRect(0, 0, data.w, data.h);

                    ctx.fillStyle = '#00ff88'; ctx.fillRect(data.exitDoor.x - 30, data.exitDoor.y - 10, 60, 20);
                    ctx.fillStyle = '#000'; ctx.font = 'bold 10px sans-serif'; ctx.textAlign = 'center';
                    ctx.fillText('SALIDA', data.exitDoor.x, data.exitDoor.y + 4);

                    data.furniture.forEach(f => drawFurnitureModel(f));
                    drawHuman(player.x, player.y, player.angle, player.clothColor);
                }
            } else {
                ctx.fillStyle = '#162816'; ctx.fillRect(-1000, -1000, 7000, 7000);

                ctx.fillStyle = '#222'; ctx.fillRect(3200, 2900, 600, 160);
                ctx.strokeStyle = '#fff'; ctx.setLineDash([20, 15]); ctx.lineWidth = 4;
                ctx.beginPath(); ctx.moveTo(3210, 2980); ctx.lineTo(3790, 2980); ctx.stroke(); ctx.setLineDash([]);

                roads.forEach(r => {
                    ctx.fillStyle = '#444'; ctx.fillRect(r.x - 8, r.y - 8, r.w + 16, r.h + 16);
                    ctx.fillStyle = '#22222b'; ctx.fillRect(r.x, r.y, r.w, r.h);
                    ctx.strokeStyle = '#ffcc00'; ctx.lineWidth = 3; ctx.setLineDash([20, 15]);
                    ctx.beginPath();
                    if(r.w > r.h) { ctx.moveTo(r.x, r.y + r.h/2); ctx.lineTo(r.x + r.w, r.y + r.h/2); }
                    else { ctx.moveTo(r.x + r.w/2, r.y); ctx.lineTo(r.x + r.w/2, r.y + r.h); }
                    ctx.stroke(); ctx.setLineDash([]);
                });

                buildings.forEach(b => {
                    ctx.fillStyle = 'rgba(0,0,0,0.4)'; ctx.fillRect(b.x + 12, b.y + 12, b.w, b.h);
                    ctx.fillStyle = b.color; ctx.fillRect(b.x, b.y, b.w, b.h);
                    ctx.fillStyle = b.roof; ctx.fillRect(b.x + 12, b.y + 12, b.w - 24, b.h - 24);
                    ctx.strokeStyle = '#00f0ff'; ctx.lineWidth = 2; ctx.strokeRect(b.x, b.y, b.w, b.h);
                    ctx.fillStyle = '#ffee00'; ctx.fillRect(b.doorX - 15, b.doorY - 8, 30, 10);
                    ctx.fillStyle = '#00f0ff'; ctx.font = 'bold 12px sans-serif'; ctx.textAlign = 'center';
                    ctx.fillText(b.label, b.x + b.w/2, b.y + 28);
                });

                loot.forEach(l => { ctx.fillStyle = '#00ff88'; ctx.fillRect(l.x - 6, l.y - 5, 12, 10); });

                npcs.forEach(npc => {
                    if(npc.alive) {
                        let col = npc.role === 'police' ? '#0055ff' : (npc.role === 'gangster' ? '#ff0055' : '#eedd00');
                        drawHuman(npc.x, npc.y, npc.angle, col);
                    }
                });

                cars.forEach(c => {
                    if(c.health <= 0) return;
                    ctx.save(); ctx.translate(c.x, c.y); ctx.rotate(c.angle);
                    ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.fillRect(-c.w/2+3, -c.h/2+3, c.w, c.h);
                    ctx.fillStyle = c.color; ctx.fillRect(-c.w/2, -c.h/2, c.w, c.h);

                    if(c.type === 'heli') {
                        ctx.fillStyle = '#222'; ctx.beginPath(); ctx.arc(0, 0, 18, 0, Math.PI*2); ctx.fill();
                        ctx.save(); ctx.rotate(rotorAngle);
                        ctx.strokeStyle = 'rgba(255,255,255,0.85)'; ctx.lineWidth = 4;
                        ctx.beginPath(); ctx.moveTo(-40, 0); ctx.lineTo(40, 0); ctx.stroke();
                        ctx.beginPath(); ctx.moveTo(0, -40); ctx.lineTo(0, 40); ctx.stroke();
                        ctx.restore();
                    } else {
                        ctx.fillStyle = '#111'; ctx.fillRect(-c.w/6, -c.h/2+3, c.w/3, c.h-6);
                        ctx.fillStyle = '#ffffaa'; ctx.fillRect(c.w/2-3, -c.h/2+2, 3, 4); ctx.fillRect(c.w/2-3, c.h/2-6, 3, 4);
                    }
                    ctx.restore();
                });

                bullets.forEach(b => {
                    ctx.fillStyle = '#ffee00'; ctx.beginPath(); ctx.arc(b.x, b.y, 3.5, 0, Math.PI*2); ctx.fill();
                });

                if(!player.inCar) drawHuman(player.x, player.y, player.angle, player.clothColor);
                skyVehicles.forEach(sv => drawAircraft(sv));
            }

            ctx.restore();
            drawMinimap();
        }

        // MINIMAPA DIBUJADO CON DIAMANTE PARA SEGUIMIENTO DE MISIÓN
        function drawMinimap() {
            mCtx.fillStyle = '#05050a'; mCtx.fillRect(0, 0, 110, 110);
            if(currentInterior) return;

            mCtx.save(); 
            mCtx.translate(55, 55);
            const scale = 0.018;

            roads.forEach(r => {
                mCtx.fillStyle = '#333';
                mCtx.fillRect((r.x - player.x)*scale, (r.y - player.y)*scale, r.w*scale, r.h*scale);
            });

            buildings.forEach(b => {
                mCtx.fillStyle = b.id === 'home' ? '#00f0ff' : '#666';
                mCtx.fillRect((b.x - player.x)*scale, (b.y - player.y)*scale, b.w*scale, b.h*scale);
            });

            // MARCADOR DE MISIÓN ACTIVA: DIAMANTE (💎)
            if(currentMission && currentMission.targetX && currentMission.targetY) {
                let mx = (currentMission.targetX - player.x) * scale;
                let my = (currentMission.targetY - player.y) * scale;

                mCtx.fillStyle = '#00ffff';
                mCtx.strokeStyle = '#ffffff';
                mCtx.lineWidth = 1.5;

                mCtx.beginPath();
                mCtx.moveTo(mx, my - 7);
                mCtx.lineTo(mx + 6, my);
                mCtx.lineTo(mx, my + 7);
                mCtx.lineTo(mx - 6, my);
                mCtx.closePath();
                mCtx.fill();
                mCtx.stroke();
            }

            // Jugador
            mCtx.fillStyle = player.clothColor; 
            mCtx.beginPath(); mCtx.arc(0, 0, 4, 0, Math.PI*2); mCtx.fill();
            mCtx.restore();
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }
        loop();
    </script>
</body>
